# Per-tileset Porytiles config for gTileset_Oros, the outdoor snows of Olympus.
# Written by tools/ichor/art/oros_build.py, which compiles it against an
# empty stand-in primary and checks its metatiles use only its own tiles and
# palettes 6-12. Pair it with aethos when compiling it directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Aethos]
  tiles:
