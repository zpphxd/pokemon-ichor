# Per-tileset Porytiles config for gTileset_Eleusa, Eleusa Village's secondary.
# Written by tools/ichor/art/eleusa_build.py, which compiles Eleusa against an
# empty stand-in primary, then points its ground cells at aethos's grass, path
# and sea. Pair it with aethos when compiling it directly.
