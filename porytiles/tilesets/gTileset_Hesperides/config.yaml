# Per-tileset Porytiles config for gTileset_Hesperides (the Garden of the Hesperides and the Atlas range).
# Written by tools/ichor/art/farlands_build.py, which compiles it against an empty
# stand-in primary, then points its ground cells at aethos's grass, path, sand,
# sea, shallows and waterfall. Pair it with aethos when compiling it directly.
