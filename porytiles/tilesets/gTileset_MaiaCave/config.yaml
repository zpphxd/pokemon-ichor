# Per-tileset Porytiles config for gTileset_MaiaCave (the Cave of Maia).
# Written by tools/ichor/art/heights_build.py, which compiles it against an empty
# stand-in primary, then points its ground cells at aethos's grass, road, sea, tall
# grass, deep shade and waterfall. Pair it with aethos when compiling it directly.
