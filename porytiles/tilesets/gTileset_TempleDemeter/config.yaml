# Per-tileset Porytiles config for gTileset_TempleDemeter, the Temple of Demeter's
# underground megaron. Written by tools/ichor/art/temple_demeter_build.py, which
# compiles it against an empty stand-in primary: it uses only its own tiles and
# palettes 6-12, so it works on any primary. Pair it with oikos directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Oikos]
  palettes:
    packing:
      hints_enabled: true
