# Per-tileset Porytiles config for gTileset_TempleArtemis, the Temple of Artemis at
# Arkadia. Written by tools/ichor/art/temple_artemis_build.py, which compiles it
# against an empty stand-in primary: it uses only its own tiles and palettes 6-12,
# so it works on any primary. Pair it with oikos directly.
