# Per-tileset Porytiles config for gTileset_Akropolis (the Akropolis of Astyra).
# Written by tools/ichor/art/astyra_build.py, which compiles it against an empty
# stand-in primary, then points its ground cells at aethos's grass, path, sand,
# sea, shallows and waterfall. Pair it with aethos when compiling it directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Aethos]
  palettes:
