# Per-tileset Porytiles config for gTileset_Skene, Thyrsa's theater.
# Written by tools/ichor/art/theater_build.py, which compiles it against an empty
# stand-in primary (and for the theater copies the crowd's palette and borrows
# aethos's grass afterwards). Rebuild it with that script, not porytiles.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Oikos]
  palettes:
    packing:
      hints_enabled: true
      hints:
        - name: wood
          colors:
            - [32, 24, 24]
            - [64, 40, 24]
            - [112, 72, 40]
            - [160, 112, 64]
            - [200, 160, 104]
            - [176, 136, 88]
            - [216, 184, 128]
            - [240, 216, 168]
            - [232, 232, 224]
            - [96, 96, 104]
            - [40, 32, 32]
        - name: masks
