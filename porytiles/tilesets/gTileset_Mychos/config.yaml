# Per-tileset Porytiles config for gTileset_Mychos, the Labyrinth's heart. Written by
# tools/ichor/art/mychos_build.py, which compiles it against an empty stand-in primary
# so it uses only its own tiles and palettes 6-12. Pair it with oikos.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Oikos]
  tiles:
    sharing:
      packing: biased
      alignment: greedy
