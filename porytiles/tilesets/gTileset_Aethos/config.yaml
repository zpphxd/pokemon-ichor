# aethos is regenerated by tools/ichor/art/paint_aethos.py. Hoenn
# secondaries point at its tiles by index and its palettes by slot, so
# tiles are only ever patched into empty slots and palettes are locked
# (see tools/ichor/art/aethos_bin.py and design/phase1/TILES_aethos.md).
tileset:
  palettes:
    edit_mode: locked
  tiles:
    edit_mode: patch
