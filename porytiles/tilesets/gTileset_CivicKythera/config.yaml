# Per-tileset Porytiles config for gTileset_CivicKythera. Written by
# tools/ichor/art/interiors_lib.py, which compiles it against an empty stand-in
# primary: it uses only its own tiles and palettes 6-12, so it works on any
# interior primary. Rebuild it with the rooms script that uses it.
