# Per-tileset Porytiles config for gTileset_CaveDark, the dark places' secondary.
# Written by tools/ichor/art/cave_dark_build.py, which compiles CaveDark against
# an empty stand-in primary and checks its metatiles use only its own tiles and
# palettes 6-12. Pair it with aethos when compiling it directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Aethos]
  tiles:
    sharing:
      packing: biased
      alignment: greedy
  palettes:
