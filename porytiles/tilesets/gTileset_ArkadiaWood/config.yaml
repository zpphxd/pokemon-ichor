# Per-tileset Porytiles config for gTileset_ArkadiaWood (the Cypress Wood and the Pool of Mnemosyne).
# Written by tools/ichor/art/kithairon_build.py, which compiles it against an empty
# stand-in primary, then points its ground cells at aethos's grass, road, sea and
# tall grass. Pair it with aethos when compiling it directly.
