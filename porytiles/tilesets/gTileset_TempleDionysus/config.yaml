# Per-tileset Porytiles config for gTileset_TempleDionysus, the Temple of Dionysus at
# Thyrsa. Written by tools/ichor/art/temple_dionysus_build.py, which compiles it
# against an empty stand-in primary: it uses only its own tiles and palettes 6-12,
# so it works on any primary. Pair it with oikos directly.
