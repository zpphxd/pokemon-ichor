# Per-tileset Porytiles config for gTileset_SeatAthena, a seat of the Pantheon.
# Written by tools/ichor/art/pantheon_build.py, which compiles it against an
# empty stand-in primary and checks its metatiles use only its own tiles and
# palettes 6-12. Pair it with oikos when compiling it directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Oikos]
  tiles:
    sharing:
      packing: biased
      alignment: greedy
  palettes:
