# Per-tileset Porytiles config for gTileset_Chion, the snows of Olympus.
# Written by tools/ichor/art/chion_build.py, which compiles Chion against
# an empty stand-in primary and checks its metatiles use only its own tiles and
# palettes 6-12. Pair it with aethos when compiling it directly.
tileset:
  primary_pairing:
    mode: manual
    partners: [gTileset_Aethos]
  tiles:
