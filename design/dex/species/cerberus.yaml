      Shadow Claw, Phantom Force, Poltergeist, Hex, Curse, Spite, Night Shade, Pain Split, Dark Pulse,
      Rock Slide]
    egg: []
  signature: >-
    The third head wakes with Ice Fang, completing Fire, Thunder and Ice Fang,
    and Strong Jaw powers all three; Tri Attack fires all three heads at once.
    Mean Look is the gate itself: nothing gets past it on the way out.
  new_move: null
