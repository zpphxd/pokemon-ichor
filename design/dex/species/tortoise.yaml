    a crossbar, with seven taut strings running back to the shell. Faint pink
    glints flicker on the strings. Terracotta and limestone shell with a
    black-figure meander band around the rim, olive skin, marble horns, a
    fairy-pink accent, black-figure ink outline. The follower's strings shimmer
    as it walks.
  shiny: Its shell turns marble white and its horns sun-gold.
  dex_entry:
