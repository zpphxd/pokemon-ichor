line: laurel
species:

- dex: 1
  concept: Laurel fawn
  name: Nebrel
  etymology: nebros (Greek, fawn) + laurel
  category: Laurel Fawn
  types: [Grass]
  abilities: [Overgrow]
  hidden_ability: Leaf Guard
  base_stats: {hp: 45, atk: 45, def: 45, spa: 60, spd: 55, spe: 60}
  ev_yield: {spa: 1}
  exp_yield: 62
  catch_rate: 45
  gender: {female_pct: 87.5}
  egg_groups: [Field, Grass]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.6
  weight_kg: 9.0
  myth: >-
    Daphne fled Apollo after Eros's arrows struck them both, running "as the
    deer runs from the lion", and was changed into the laurel (Ovid,
    Metamorphoses 1).
  expression: >-
    The fawn of Ovid's simile, all legs and nerves, with two laurel leaves for
    ears. The line is mostly female, as its nymph should be.
  art: >-
    Small: it fills about 34×38 px of the box. A slender fawn in three-quarter
    view facing left, mid-step on thin legs, head up and alert. Two oversized
    laurel-leaf ears and a stubby sapling tail with two leaves. Limestone-tan
    coat with a pale belly and white spots in a laurel-leaf pattern along the
    back. Big dark eyes with a sun-gold glint. Limestone body, olive leaves with
    a silver-leaf highlight, black-figure ink outline. The follower trots with
    its ears flicking.
  shiny: The leaves turn autumn sun-gold and the coat pales to marble.
  dex_entry:
    - Its ears are two laurel leaves. When it
    - senses danger, it bolts, and it is said
    - that no one has ever caught one that
    - did not wish to be caught.
  habitat: >-
    Given by Professor Daphne at the Akademia grove, Elaia. It isn't found in
    the wild until the post-game Sanctuary of Firsts.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Growl]
      - [4, Leafage]
      - [7, Quick Attack]
      - [10, Razor Leaf]
      - [13, Fairy Wind]
      - [16, Magical Leaf]
      - [19, Synthesis]
      - [22, Charm]
      - [25, Leaf Tornado]
      - [28, Giga Drain]
      - [31, Draining Kiss]
      - [34, Grassy Terrain]
      - [37, Energy Ball]
      - [40, Leaf Storm]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Charm, Sunny Day, Grassy Terrain,
      Misty Terrain, Light Screen, Safeguard, Bullet Seed, Magical Leaf, Seed Bomb, Energy Ball,
      Giga Drain, Grass Knot, Solar Beam, Grass Pledge, Leaf Storm, Trailblaze, Dazzling Gleam,
      Draining Kiss, Disarming Voice, Fake Tears, Helping Hand, Covet, Agility, Double Kick, Bounce,
      Body Slam, Take Down, Weather Ball, Worry Seed]
    egg: [Leech Seed, Aromatherapy, Grass Whistle, Baton Pass, Wish, Captivate]
  signature: >-
    Quick and evasive from the start. Quick Attack and Agility come early,
    because the whole line is about running.
  new_move: null

