  myth: >-
    At the river's edge Daphne became the laurel: feet rooted, arms turned to
    branches, hair to leaves. Apollo made the tree his own, and its wreath
    crowns every victor (Ovid, Metamorphoses 1).
  expression: >-
    The moment of change, held still. It's half nymph and half laurel, rooted
    by choice, wearing the living crown that the player's laurels imitate.
  art: >-
    Large: it fills about 60×62 px. A tall, graceful dryad facing left, her bark
    gown flaring out and splitting into roots at the hem. One arm lifts into a
    leafy laurel bough, and long laurel leaves fall from her head like hair
    under a wreath of sun-gold berries. A clean, calm Pokémon face with sun-gold
    eyes. Cypress-gray bark, olive and silver-leaf foliage, sun-gold berries,
    marble skin, black-figure ink outline. Frame 2 sways the leaves and bough;
    the follower glides with its roots trailing like a hem.
  shiny: The whole canopy turns autumn sun-gold, with marble-white bark.
  dex_entry:
    - When it has run as far as it wishes, it
    - roots itself and becomes a laurel tree.
