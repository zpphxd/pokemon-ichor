  myth: >-
    The winged horse Pegasus sprang from the Gorgon's neck when Perseus cut off
    her head, flew up to the gods, and lives in Zeus's house carrying his
    thunder and lightning (Hesiod, Theogony 280–286). Bellerophon tamed him only
    with Athena's golden bridle (Pindar, Olympian 13.63–92), and his hoof struck
    the spring Hippocrene from the rock (Pausanias 9.31.3).
  expression: >-
    Zeus's thunder on four hooves. No one rides it without a golden bridle, and
    anything that tries to tame it by force only makes it stronger.
  art: >-
    Large: it fills about 60×56 px. A white winged stallion rearing in
    three-quarter view facing left, forelegs raised, great wings spread up and
    back. Its mane and tail are crackling forks of lightning, its hooves are
    bronze and throw sparks, and a golden bridle crosses its face. Marble-white
    coat shaded with pale Aegean blue, sun-gold mane, tail and wing tips, a
    bright electric-yellow accent at the lightning's core, black-figure ink
    outline. The back sprite shows the wings from above; the follower trots,
    and small sparks jump from its hooves.
  shiny: The coat turns storm-dark gray and the lightning turns Aegean blue.
  dex_entry:
    - It leapt into the world from a monster's
    - severed neck. Now it bears the thunder of
    - the sky king. Where its hoof strikes rock,
    - a cold spring wells up.
  habitat: >-
    The cloud meadows of Olympus, after you beat the Archon (post-game). It
    grazes by the spring it struck from the rock and appears only during
    thunderstorms (static, level 70, one only).
