  myth: >-
    Pandora lifted the lid of the great jar, the pithos, and scattered every
    sorrow among mortals. Only Elpis, Hope, stayed inside under the lip, because
    the lid came down before she could fly out (Hesiod, Works and Days 90–105).
  expression: >-
    The last light left in the jar. Ichor's storage is the Pithos, so this is
    the light that keeps stored Pokémon company. Its name shares a root with
    Elpis, the girl whose thread was meant to be short.
  art: >-
    Small: it fills about 32×36 px. A tiny moth curled in the open mouth of a
    small terracotta pithos with black-figure bands, in three-quarter view
    facing left, its soft wings just spread over the jar's lip like a lantern's
    paper panes. Its plump body glows from within, and two feathery antennae
    curl up like smoke. A terracotta jar with ink bands, marble-white wings
    with a sun-gold inner glow, a soft Fairy-pink accent at the wing edges,
    black-figure ink outline. The follower flutters at your shoulder in a small
    circle of light.
  shiny: The glow turns pale Aegean blue and the jar turns marble white.
  dex_entry:
    - When every evil flew out of the great
    - jar, it alone stayed, curled under the
    - lip. Pokémon resting in a pithos are
    - never alone. Its soft light is with them.
  habitat: >-
    The last sealed pithos, after the League (post-game). Suggested: Elpis
    finds the jar and lifts the lid, and it rises out to you (static, level 50,
    one only).
