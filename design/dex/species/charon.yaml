  egg_groups: [Amorphous]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 1.4
  weight_kg: 11.0
  myth: >-
    On the bank the shades crowd forward, stretching out their hands in longing
    for the far shore, while the ferryman takes some aboard and drives the rest
    back (Virgil, Aeneid 6).
  expression: >-
    Decades on the bank have drawn its hood down and stretched both arms toward
    a crossing it still can't make.
  art: >-
    Medium: it fills about 44×54 px. A hooded wraith in three-quarter view
    facing left, leaning into the wind with both long arms reaching out ahead.
    A deep cowl hides everything but two pale eyes, and the robe frays into
    tatters at the hem. Cypress-dark robe with Aegean-blue folds, marble-gray
    hands, a thin sun-gold rim on the hood, black-figure ink outline. The back
    sprite shows the hood and tatters streaming toward the player.
  shiny: The robe turns from cypress to a deep terracotta red.
  dex_entry:
    - It waits on the shore with its hood drawn
    - low and both hands reaching for the far
    - bank. It has waited so long that it no
    - longer remembers why.
  habitat: >-
    Evolves from Obolorn at level 30. Common in Astyra's Kerameikos cemetery at
    night, at levels 30–36, drifting among the grave stelai. In the post-game,
    uncommon in the grass by the cave mouth at Cape Tainaron, at dusk and at
    night.
