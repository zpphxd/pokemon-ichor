  category: Ferryman
  types: [Ghost, Water]
  abilities: [Cursed Body, Pressure]
  hidden_ability: Perish Body
  base_stats: {hp: 90, atk: 75, def: 85, spa: 110, spd: 100, spe: 60}
  ev_yield: {spa: 2, spd: 1}
  exp_yield: 245
  catch_rate: 45
  gender: {female_pct: 50}
  egg_groups: [Amorphous]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 2.4
  weight_kg: 190.0
  myth: >-
    Charon, the grim old ferryman of the dead, poles his skiff across the
    underworld's rivers and will carry no one who cannot pay the obol (Virgil,
    Aeneid 6; Aristophanes, Frogs).
  expression: >-
    The shade that waited longest became the ferryman. It's fused to its reed
    boat, and the obol it was never given now hangs at its neck.
  art: >-
    Large: it fills about 60×58 px. A gaunt, bearded ferryman in three-quarter
    view facing left, his body growing out of the stern of a reed boat so that
    man and boat are one. One bony hand grips a long pole that crosses the
    frame, and the other holds up a lantern. Hollow eyes under a ragged hood,
    and an obol on a cord at his neck. Cypress-dark hood, limestone reeds, the
    darkest Aegean blue for the water at the hull, sun-gold lantern and coin,
    black-figure ink outline. The follower glides with ripples under the hull.
  shiny: The reeds turn black and the lantern burns pale blue instead of gold.
  dex_entry:
    - It poles its reed boat across black water
    - and never speaks. It carries only those
    - who bring an old coin. The rest it leaves
    - on the bank for a hundred years.
  habitat: >-
    Evolves from Kalyptor when it levels up holding a Relic Copper, the old
