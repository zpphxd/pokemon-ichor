line: charon
species:

- dex: 77
  concept: Unburied shade
  name: Obolorn
  etymology: obolos (Greek, the coin for the ferryman) + forlorn
  category: Shade
  types: [Ghost]
  abilities: [Cursed Body, Pickup]
  hidden_ability: Infiltrator
  base_stats: {hp: 40, atk: 40, def: 40, spa: 70, spd: 50, spe: 60}
  ev_yield: {spa: 1}
  exp_yield: 58
  catch_rate: 190
  gender: {female_pct: 50}
  egg_groups: [Amorphous]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 0.6
  weight_kg: 2.5
  myth: >-
    The unburied dead may not cross the Styx. They wander its near bank for a
    hundred years (Virgil, Aeneid 6). The Greeks laid an obol in the mouth of
    the dead to pay the ferryman.
  expression: >-
    A shade with no coin, so its whole body has become a held-out hand. The
    empty palm is the missing obol.
  art: >-
    Small: it fills about 30×36 px. A wisp of a shade in three-quarter view
    facing left, its lower half trailing into smoke, one thin arm held out with
    the palm open and empty. A round pale face with two hollow eyes and a
    downturned mouth, and a faint coin-shaped glint in the palm where the obol
    should be. Marble-gray body fading to transparent at the tail, Aegean-blue
    shadows, a sun-gold glint in the palm, black-figure ink outline. The
    follower drifts toward the player with its palm out.
  shiny: Its body turns a cold green-gray and the glint in its palm turns silver.
  dex_entry:
    - It holds out an empty palm to everyone it
    - meets, hoping for a coin. Those who give
    - one are said to hear a faint thank-you on
    - the night wind.
  habitat: >-
    Rare in Astyra's Kerameikos cemetery at night, at level 28, among the
    paupers' graves outside the wall. None are seen there by day. It drifts
    toward trainers who carry money. A very few (1%) wander the Sacred Way's
    roadside tombs on Route 2 at night, levels 15–20, where the road leaves
    the Kerameikos.
  learnset:
    level_up:
      - [1, Astonish]
      - [1, Spite]
      - [4, Disable]
      - [8, Shadow Sneak]
      - [12, Covet]
      - [16, Night Shade]
      - [20, Hex]
      - [24, Mean Look]
      - [28, Will-O-Wisp]
      - [32, Shadow Ball]
      - [36, Grudge]
      - [40, Memento]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Thief, Shadow Ball,
      Will-O-Wisp, Hex, Confuse Ray, Night Shade, Pain Split, Spite, Curse, Snarl, Dark Pulse,
      Payback, Torment, Embargo, Taunt, Trick, Icy Wind, Rain Dance, Psych Up, Sucker Punch,
      Ominous Wind, Fling, Helping Hand, Fake Tears]
    egg: [Destiny Bond, Imprison, Haze, Nightmare, Bestow, Shadow Punch]
  signature: >-
    Pickup and Covet: the open palm takes whatever it's offered. Grudge and
    Memento come late, from a shade with nothing left to lose.
  new_move: null

