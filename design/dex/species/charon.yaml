      - [1, Disable]
      - [1, Shadow Sneak]
      - [12, Covet]
      - [16, Night Shade]
      - [20, Hex]
      - [24, Mean Look]
      - [28, Will-O-Wisp]
      - [33, Shadow Ball]
      - [37, Curse]
      - [41, Grudge]
      - [45, Pain Split]
      - [49, Phantom Force]
      - [53, Memento]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Thief, Shadow Ball,
      Will-O-Wisp, Hex, Confuse Ray, Night Shade, Pain Split, Spite, Curse, Snarl, Dark Pulse,
      Payback, Torment, Embargo, Taunt, Trick, Icy Wind, Rain Dance, Psych Up, Sucker Punch,
      Ominous Wind, Fling, Helping Hand, Fake Tears, Phantom Force, Poltergeist, Nasty Plot,
      Calm Mind, Foul Play, Knock Off, Dream Eater, Shadow Claw, Scary Face, Skill Swap]
    egg: []
  signature: >-
    It learns Ominous Wind on evolving, the cold wind off the far bank. Frisk
    and Mean Look make it a watcher that won't let you leave.
  new_move: null

- dex: 79
  concept: Ferryman
