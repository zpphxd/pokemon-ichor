line: sisyphus
species:

- dex: 131
  concept: Boulder-pusher
  name: Bouldyphus
  etymology: boulder + Sisyphos (Greek, the king who cheated death)
  category: Uphill
  types: [Rock, Ghost]
  abilities: [Sturdy, Rock Head]
  hidden_ability: Stamina
  base_stats: {hp: 80, atk: 115, def: 125, spa: 45, spd: 85, spe: 35}
  ev_yield: {def: 2}
  exp_yield: 175
