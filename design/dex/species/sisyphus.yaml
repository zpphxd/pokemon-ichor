  myth: >-
    Sisyphus cheated death twice: he chained Thanatos, then talked Persephone
    into letting him go back to the living. His punishment in the underworld is
    to roll a boulder up a hill forever, and it always rolls back down (Odyssey
    11.593–600; Theognis 702–712).
  expression: >-
    A ghost that has made peace with its punishment. It pushes the boulder
    because pushing is what it does, and the grin says it still thinks it got
    the better deal.
  art: >-
    Medium-large: it fills about 52×50 px, mostly boulder. A squat gray ghost in
    three-quarter view facing left, bent forward with one shoulder and both long
    arms braced against a round boulder bigger than itself, its legs fading into
    a wisp that trails downhill. A wide, toothy grin and one eye squeezed shut
    from effort. Marble-gray boulder with a limestone highlight and one crack,
    the ghost in dark marble with a pale violet type accent in the wisp and a
    sun-gold glint in the open eye, black-figure ink outline. The follower
    pushes its boulder a tile ahead, and every so often the boulder rolls back.
  shiny: The boulder turns terracotta and the ghost pales to marble white.
  dex_entry:
    - It rolls its boulder up the slope all day.
    - At the top the stone slips and rolls back
    - down. It only grins and starts again. It
    - once tied up Death with a chain, they say.
  habitat: >-
    The endless slope in Tartarus, deepest of the post-game Katabasis. Common
    there at any hour, since the underworld has no day; each one is found
    pushing its boulder up the same hill.
