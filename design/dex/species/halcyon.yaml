line: halcyon
species:

- dex: 29
  concept: Halcyon chick
  name: Halcyling
  etymology: halkyon (Greek, kingfisher) + -ling
  category: Sea Nest
  types: [Water, Flying]
  abilities: [Cloud Nine, Keen Eye]
  hidden_ability: Sniper
  base_stats: {hp: 40, atk: 45, def: 35, spa: 50, spd: 40, spe: 75}
  ev_yield: {spe: 1}
  exp_yield: 56
  catch_rate: 190
  gender: {female_pct: 50}
  egg_groups: [Water 1, Flying]
  egg_cycles: 20
  growth_rate: Medium Fast
  height_m: 0.3
  weight_kg: 1.8
  myth: >-
    Each winter Alcyone, turned into a kingfisher, broods her eggs in a nest
    floating on the sea, and her father Aeolus holds back the winds for seven
    days so the water stays calm (Ovid, Metamorphoses 11).
  expression: >-
    A kingfisher chick that rides its own floating nest. Wherever it sleeps,
    the swell lies down flat around it.
  art: >-
    Small: it fills about 32×30 px. A round kingfisher chick in three-quarter
    view facing left, sitting in a small floating nest of driftwood and
    sea-wrack, with an oversized dagger beak, stubby wings and a short tufted
    crest. A thin, perfectly flat waterline laps the nest. Aegean blue crown
    and back, terracotta-orange breast, marble-white throat, a limestone and
    olive nest, black-figure ink outline. The follower hops behind and floats
    on water tiles.
  shiny: Its blue turns olive green and its breast sun-gold.
  dex_entry:
    - It is born in a nest that floats on the
    - winter sea. While it sleeps there, the
    - wind holds its breath and the waves lie
    - down flat.
  habitat: >-
    Akti harbor and every coast, mornings and evenings; common along the
    water's edge and on the water while Surfing. During the halcyon days at
    Akti harbor its nests float all over the bay.
  learnset:
    level_up:
      - [1, Peck]
      - [1, Water Gun]
      - [1, Growl]
      - [4, Mist]
      - [7, Quick Attack]
      - [10, Wing Attack]
      - [13, Aqua Jet]
      - [16, Water Pulse]
      - [19, Pluck]
      - [22, Roost]
      - [25, Air Slash]
      - [28, Calm Mind]
      - [31, Dive]
      - [35, Drill Peck]
      - [39, Brave Bird]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Water Pulse, Surf, Dive,
      Scald, Brine, Whirlpool, Chilling Water, Ice Beam, Icy Wind, Blizzard, Hail, Rain Dance,
      Weather Ball, Aerial Ace, Air Slash, Fly, Roost, Steel Wing, U-turn, Acrobatics, Pluck,
      Tailwind, Defog, Calm Mind, Agility, Safeguard, Helping Hand, Thief]
    egg: [Aqua Ring, Feather Dance, Water Sport, Mirror Move, Soak, Gust]
  signature: >-
    Cloud Nine from the start: no rain, sun, sand or snow works while it's on
    the field. Mist and Calm Mind round out the calm.
  new_move: null

