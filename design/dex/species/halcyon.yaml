    from deep to pale on the wings and back, terracotta-orange breast,
    marble-white throat, a sun-gold eye ring, black-figure ink outline. The
    back sprite shows the full wingspan with a pale blue bar across each wing.
  shiny: Its blue turns olive green and its breast sun-gold.
