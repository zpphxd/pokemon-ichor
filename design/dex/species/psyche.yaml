- dex: 15
  concept: Soul caterpillar
  name: Kampillar
  etymology: kampe (Greek, caterpillar) + caterpillar
  category: Soul Worm
  types: [Bug]
  abilities: [Shield Dust]
  hidden_ability: Run Away
  base_stats: {hp: 45, atk: 28, def: 36, spa: 26, spd: 25, spe: 40}
  ev_yield: {hp: 1}
  exp_yield: 50
  catch_rate: 255
  gender: {female_pct: 50}
  egg_groups: [Bug]
  egg_cycles: 15
  growth_rate: Medium Fast
  height_m: 0.3
  weight_kg: 2.5
  myth: >-
    Greek psyche means both soul and butterfly. Aristotle uses it for the
    winged creature that comes out of the caterpillar, the kampe (History of
    Animals 5.19).
  expression: >-
    A plain green caterpillar with a faint glow under its skin, as if something
    inside is waiting to get out.
  art: >-
    Small: it fills about 32×24 px. A plump caterpillar in three-quarter view
    facing left, its front end raised and curious. Two big soft eye-spots mark
    its head segment, and a faint light shows through the middle of its body.
    Olive segments with silver-leaf bands, marble eye-spots with black-figure
    ink pupils, a pale Aegean-blue glow, black-figure ink outline. The follower
    inches along with its glow pulsing.
  shiny: A pale silver-leaf body with a sun-gold glow inside.
  dex_entry:
    - Hold one up to the light and something
    - flickers inside it. Old women in Elaia
    - say it is a soul, waiting for wings.
  habitat: >-
    Elaia's olive groves and Route 1, in tall grass and on low branches in the
    morning. Very common.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, String Shot]
      - [4, Bug Bite]
      - [8, Struggle Bug]
      - [11, Confusion]
      - [15, Infestation]
      - [19, Safeguard]
      - [25, Psybeam]
      - [31, Bug Buzz]
      - [35, Psychic]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Struggle Bug, Bug Bite,
      Electroweb, Pounce, Psych Up, Infestation]
    egg: [Rage Powder, Pollen Puff, Heal Bell, Tailwind, Sweet Kiss]
  signature: >-
    It evolves at level 7, sooner than almost anything. An unevolved one picks
    up Confusion at 11, a hint of the soul inside.
  new_move: null

- dex: 16
