  myth: >-
    An oracle ordered Psyche dressed as a bride and left on a mountain crag for
    a monster to marry, and she was led there in a procession that was half
    wedding, half funeral (Apuleius, Metamorphoses 4.33–35).
  expression: >-
    The chrysalis hangs like a veiled bride waiting on her crag. Greek nymphe
