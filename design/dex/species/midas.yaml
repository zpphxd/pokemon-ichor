      - [1, Tackle]
      - [1, Growl]
      - [1, Confide]
      - [1, Metal Sound]
      - [7, Double Kick]
      - [10, Pay Day]
      - [13, Stomp]
      - [16, Uproar]
      - [20, Headbutt]
      - [22, Gyro Ball]
      - [24, Covet]
      - [28, Take Down]
      - [32, Iron Head]
      - [34, Hyper Voice]
      - [38, Heavy Slam]
      - [42, Double-Edge]
      - [46, Endeavor]
      - [52, Body Press]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Body Slam, Double-Edge,
      Take Down, Headbutt, Uproar, Hyper Voice, Echoed Voice, Endeavor, Last Resort, Helping Hand,
      Work Up, Retaliate, Covet, Thief, Pay Day, Double Kick, Low Kick, Bulldoze, Dig,
      Stomping Tantrum, Mud-Slap, Iron Tail, Zen Headbutt, Charm, Sunny Day, Rain Dance, Trailblaze,
      Rock Smash, Strength, Iron Head, Heavy Slam, Gyro Ball, Iron Defense, Steel Roller, Body Press,
      Earthquake, High Horsepower, Rock Slide, Rock Tomb, Payback, Hyper Beam, Giga Impact]
    egg: []
  signature: >-
    Heavy Metal doubles its golden weight for Heavy Slam, and Gyro Ball rewards
    how slow it is. Its hidden ability, Good as Gold, shrugs off every status
    move, because gold never tarnishes.
  new_move: null
