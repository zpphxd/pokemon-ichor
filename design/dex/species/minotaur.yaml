  myth: >-
    Asterion, the Minotaur, was born to Queen Pasiphae after Poseidon cursed
    her to love his white bull. King Minos hid the child in Daedalus's
    Labyrinth and fed him Athenian youths until Theseus killed him
    (Apollodorus, Library 3.1 and Epitome 1).
  expression: >-
    A monster made by other people's sins, then hidden away for being one. It
    is built to fight, but its eyes are sad, and the chain it broke still
    hangs from one wrist.
  art: >-
    Large: it fills the box, about 60×62 px. A hulking bull-headed brute in
    three-quarter view facing left, hunched, fists low, head bowed so the horns
    point forward. Long curved horns, a heavy muzzle, big dark eyes turned
    down, and pale spots across the shoulders like stars, for its name
    Asterion, the starry one. A bronze shackle with three broken links hangs
    from the left wrist. Dark limestone-brown hide, cypress-dark mane,
    marble-white horns, a sun-gold shackle, black-figure ink outline. The
    follower walks slowly and keeps glancing back at the player.
  shiny: Its hide turns night-blue, and the star spots on its shoulders shine sun-gold.
  dex_entry:
    - It was shut in the dark so long ago that
    - it has forgotten the sun. It fights all
    - who enter its maze, yet those who escape
    - say they heard it weeping.
  habitat: >-
    One only. It waits at the center of the Labyrinth on Knossa Isle, chained
    at the heart of Team Titan's headquarters. After the raid it stays there
    in the dark and can be battled and caught, day or night. Breeding is the
    only way to get another.
