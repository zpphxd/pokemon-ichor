  egg_groups: [Grass]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.5
  weight_kg: 4.0
  myth: >-
    Prometheus hid fire in a hollow fennel stalk, the narthex, stole it from the
    gods and gave it to mortals (Hesiod, Works and Days 47–52).
  expression: >-
    An unlit sprout with a hollow stem, made to carry a flame it doesn't have
    yet.
  art: >-
    Small: it fills about 40×45 px. A fennel sprout in three-quarter view facing
    left: a plump, bulb-shaped pale stalk for a body with a round face, big dark
    eyes and a tiny nose, two feathery fronds for arms, and a long hollow neck
    open at the top like a tiny chimney, crowned by a little umbel of yellow
    buds. Limestone stalk, olive fronds, sun-gold buds, black-figure ink
    outline. Frame 2 blinks and waves a frond; the follower hops along on its
    root.
  shiny: Its fronds turn rust-red and its buds turn white.
  dex_entry:
    - Its stalk is hollow all the way down. It
    - loves warm, dry hillsides and turns its
    - head to follow the sun, as if it were
    - waiting to be lit.
  habitat: >-
    Uncommon by day on Kaldera's volcanic slopes. A rare one grows on
    Kalliste's dry hillsides.
