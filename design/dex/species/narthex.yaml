      Safeguard, Weather Ball, Trailblaze, Flash, Endeavor]
    egg: [Ingrain, Leech Seed, Ember, Nature Power, Aromatic Mist]
  signature: >-
    Flash Fire lets it catch a flame in its hollow stem before it can use one.
    Symbiosis, its hidden ability, hands its own item to an ally: a gift.
