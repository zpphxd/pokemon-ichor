    level_up:
      - [1, Peck]
      - [1, Growl]
      - [4, Ember]
      - [8, Gust]
      - [12, Echoed Voice]
      - [16, Incinerate]
      - [20, Wing Attack]
      - [24, Sing]
      - [28, Flame Burst]
      - [32, Air Cutter]
      - [36, Flamethrower]
      - [40, Hyper Voice]
      - [44, Heat Wave]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
