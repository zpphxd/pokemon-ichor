species:

- dex: 118
  concept: Sun cygnet
  name: Hymnet
  etymology: hymnos (Greek, hymn) + cygnet
  category: Sun Cygnet
  types: [Fire]
  abilities: [Flash Fire, Punk Rock]
  hidden_ability: Flame Body
  base_stats: {hp: 50, atk: 45, def: 45, spa: 70, spd: 55, spe: 60}
  ev_yield: {spa: 1}
  exp_yield: 64
  catch_rate: 120
  gender: {female_pct: 50}
  egg_groups: [Flying, Water 1]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.5
  weight_kg: 4.5
  myth: >-
    Swans drew Apollo's chariot north to the land of the Hyperboreans each
    winter, and brought him back to Delphi singing at midsummer (Alcaeus, as
    retold by Himerius, Orations 48).
  expression: >-
    A plain gray cygnet that paddles after the sun. It can't sing yet, only
    peep, but its downy wingtips already glow when the sun comes up.
  art: >-
    Small: it fills about 30×32 px. A round, fluffy cygnet in three-quarter
    view facing left, floating with its neck tucked and one stubby wing raised.
    Gray down, a short dark beak, and wingtips that glow like embers. Marble-gray
    down, sun-gold and terracotta ember tips, black-figure ink for the beak and
    outline. The follower paddles and leaves a trail of steam on water.
  shiny: Limestone-tan down with Aegean-blue ember tips.
  dex_entry:
    - It paddles toward the sunrise every
    - morning. Its wingtips glow like coals,
    - and the spring water steams wherever
    - it has been swimming.
  habitat: >-
    Rare, and only when the day's omen sends one. A single cygnet then waits by
    the Kastalian spring, Delphoi, at dawn, at level 33.
