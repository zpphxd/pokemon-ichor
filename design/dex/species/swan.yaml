      Flamethrower, Fire Blast, Heat Wave, Overheat, Flame Charge, Mystical Fire, Incinerate, Fire Spin,
      Aerial Ace, Air Cutter, Air Slash, Pluck, Roost, Tailwind, Defog, Hyper Voice, Echoed Voice,
      Uproar, Disarming Voice, Charm, Helping Hand, Weather Ball, Swift, Covet]
    egg: [Aqua Ring, Mist, Feather Dance, Haze, Brave Bird, Healing Wish]
  signature: >-
    The line is about sound before it is about fire: Punk Rock from the start,
    Echoed Voice at 12 and Sing at 24.
  new_move: null

- dex: 119
  concept: Swan of Apollo
  name: Hymnaria
  etymology: hymnos (Greek, hymn) + aria
  category: Swan Song
  types: [Fire, Flying]
  abilities: [Flash Fire, Punk Rock]
  hidden_ability: Flame Body
  base_stats: {hp: 80, atk: 60, def: 70, spa: 115, spd: 85, spe: 85}
  ev_yield: {spa: 2}
  exp_yield: 190
  catch_rate: 45
  gender: {female_pct: 50}
  egg_groups: [Flying, Water 1]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 1.5
  weight_kg: 21.0
  myth: >-
    Swans were Apollo's birds. Socrates says they sing their finest song just
    before they die, not from grief but from joy at going to the god they
    serve (Plato, Phaedo 84e–85b).
  expression: >-
    A white swan of Apollo whose sun-gold wingtips burn as it sings. Every
    song is sung as if it were its last.
  art: >-
    Large: it fills about 62×60 px. An elegant white swan in three-quarter view
    facing left, gliding on still water with its neck in a high S-curve and beak
    open in song. Its near wing rises as one massed sheaf of sun-gold feathers
    whose tips burn, and its far wing arches up over a sun-disc halo behind its
    head, crowned with small flames. Marble-white body, sun-gold and terracotta
    burning feathers, an orange beak, black-figure ink outline. Frame 2 flares
    the wings and flames; the back sprite shows both wings spread as two burning
    fans.
  shiny: Black plumage with Aegean-blue flames, like a black swan at night.
  dex_entry:
    - When it sings, its sun-gold wingtips
    - burn. It is said it sings most
    - beautifully of all just before it
    - faints, so no Trainer wants to hear it.
  habitat: >-
    Evolves from Hymnet at level 35. Uncommon on the pools of the Kastalian
    spring, Delphoi, at dawn and by day, at levels 48–52. Surfing the pools
    turns up more.
  learnset:
    level_up:
      - [0, Air Slash]
      - [1, Peck]
      - [1, Growl]
      - [1, Ember]
      - [1, Gust]
      - [12, Echoed Voice]
      - [16, Incinerate]
      - [20, Wing Attack]
      - [24, Sing]
      - [28, Flame Burst]
      - [32, Air Cutter]
      - [38, Flamethrower]
      - [42, Hyper Voice]
      - [46, Mystical Fire]
      - [50, Heat Wave]
      - [53, Roost]
      - [56, Hurricane]
      - [60, Perish Song]
      - [64, Burn Up]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Sunny Day, Will-O-Wisp,
      Flamethrower, Fire Blast, Heat Wave, Overheat, Flame Charge, Mystical Fire, Incinerate, Fire Spin,
      Aerial Ace, Air Cutter, Air Slash, Pluck, Roost, Tailwind, Defog, Hyper Voice, Echoed Voice,
      Uproar, Disarming Voice, Charm, Helping Hand, Weather Ball, Swift, Covet, Fly, Hurricane,
      Brave Bird, Hyper Beam, Solar Beam]
    egg: []
  signature: >-
    Mystical Fire at 46 burns and dulls a foe's Special Attack, and Punk Rock
    makes every song hit harder. Perish Song at 60 is the swan song itself.
  new_move: null
