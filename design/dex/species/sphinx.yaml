  myth: >-
    The Sphinx sat on a rock outside Thebes and asked every traveler a riddle,
    strangling those who failed. When Oedipus answered it, she threw herself
    from the rock (Apollodorus, Library 3.5.8). Her name comes from sphingo,
    "to squeeze".
  expression: >-
    A calm, knowing lioness on a roadside rock. Her coiled tail is both the
    question and the squeeze.
  art: >-
    Large: it fills about 57×60 px. A winged lioness crouched on a rock in
    three-quarter view facing left, forepaws together and head high. A calm
    feline face with heavy-lidded violet eyes, framed by terracotta braids and a
    gold fillet, an eagle wing raised behind her like a sail, and a long tail
    curled into a question-mark hook. Limestone-tan coat with sun-gold
    highlights, terracotta braids and wing bars, a pale limestone rock beneath
    her, black-figure ink outline. Frame 2 stirs the wing and turns her head;
    the follower pads after the player with its tail still curled.
  shiny: Her coat turns marble-white and her wings turn black-figure dark.
  dex_entry:
    - It sits beside the mountain road and asks
    - each traveler a riddle. Its tail tightens
    - on those who fail. If one ever answers, it
    - leaps from its rock and is gone.
  habitat: >-
    Rare, by day only, in the rocky grass along the mountain road from Astyra
    to Delphoi. It sits on high rocks above the switchbacks and comes down to
    meet anyone who walks past.
