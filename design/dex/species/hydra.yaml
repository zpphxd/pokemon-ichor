line: hydra
species:

- dex: 140
  concept: Marsh hatchling
  name: Lernip
  etymology: Lerna (Greek, the Hydra's marsh) + nip
  category: Marsh Hatch
  types: [Dragon, Poison]
  abilities: [Poison Touch, Shed Skin]
  hidden_ability: Regenerator
  base_stats: {hp: 55, atk: 65, def: 45, spa: 50, spd: 40, spe: 45}
  ev_yield: {atk: 1}
  exp_yield: 60
  catch_rate: 45
  gender: {female_pct: 50}
  egg_groups: [Water 1, Dragon]
  egg_cycles: 40
  growth_rate: Slow
  height_m: 0.6
  weight_kg: 9.5
  myth: >-
    Hera raised the Hydra in the marsh of Lerna, out of hatred for Herakles, to
    be the death of him (Hesiod, Theogony 313–318).
  expression: >-
    The Hydra before it is a hydra: one head, and two lumps on its neck where
    the next ones are waiting. It hatches only in rain because Lerna's marsh
    was fed by springs that never ran dry.
  art: >-
    Small: it fills about 32×30 px. A stubby marsh serpent hatchling in
    three-quarter view facing left, crouched low on four short legs with a
    curl of tail behind and a scrap of eggshell stuck to it. One big head with a
    wide mouth and two small knobs on its neck where more heads will grow.
    Cypress-green and olive scales with a limestone belly, a poison-violet
    accent in its spots and drool, a sun-gold eye, black-figure ink outline. The
    follower waddles and snaps at flies.
  shiny: The scales turn Aegean blue and the spots turn sun-gold.
  dex_entry:
    - It hatches only after heavy rain, in the
    - reeds of a still lake. Its one head bites
    - anything that moves. Two lumps on its
    - neck are heads that have not woken yet.
  habitat: >-
    The reed marshes of Lake Stymphalia, Lakonia, only while it's raining
    (rare, any time of day). Look in the deepest reeds with the Augur's Eye.
  learnset:
    level_up:
      - [1, Bite]
      - [1, Poison Gas]
      - [4, Twister]
      - [8, Acid]
      - [12, Poison Fang]
      - [16, Dragon Breath]
      - [20, Scary Face]
      - [24, Scale Shot]
      - [28, Toxic]
      - [32, Poison Jab]
      - [36, Crunch]
      - [40, Dragon Rush]
      - [44, Coil]
      - [48, Gunk Shot]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Venoshock, Sludge Bomb,
      Poison Jab, Toxic Spikes, Acid Spray, Dragon Pulse, Dragon Tail, Breaking Swipe, Scale Shot,
      Dragon Claw, Crunch, Snarl, Taunt, Thief, Bulldoze, Dig, Mud Shot, Mud-Slap, Surf, Rain Dance,
      Aqua Tail, Ice Fang, Fire Fang, Thunder Fang, Iron Tail, Body Slam, Scary Face, Roar]
    egg: [Venom Drench, Haze, Poison Tail, Mud Bomb, Glare, Double Hit]
  signature: >-
    Regenerator from the egg, as a hidden ability: the line is about heads
    growing back. Scale Shot at 24 gives it a multi-hit Dragon move early.
  new_move: null

- dex: 141
