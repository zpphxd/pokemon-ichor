  myth: >-
    Endymion, a shepherd loved by Selene, the Moon, was granted eternal sleep
    and eternal youth on Mount Latmos, where she comes down to him every night
    (Apollodorus 1.7.5; Apollonius of Rhodes, Argonautica 4.57–58).
  expression: >-
    Endymion as one of his own lambs, curled up and never waking. Comatose
