  art: >-
    Small: it fills about 38×30 px. A plump lamb in three-quarter view facing
    left, curled up asleep with its chin on its forelegs and its eyes shut in
    a contented smile. One horn curves into a shepherd's crook, and its
    fleece is a soft cloud with a crescent-moon curl on the flank. A few
    floating dream bubbles rise from it. Marble-white fleece with pale
    Aegean-blue shading, limestone crook horn, Psychic-pink dream bubbles as
    the accent, black-figure ink outline. The follower is carried along
    asleep, drifting a little above the ground.
  shiny: Its fleece turns pale sun-gold, like the moon low on the horizon.
  dex_entry:
    - It has slept since it was born and will
    - never grow old. On moonlit nights a pale
    - light settles beside it, and it smiles
    - in its sleep.
  habitat: >-
    Arkadia's moonlit meadows, at night only; rare. It never wakes, so it
    shows up only by wandering into the grass where it sleeps.
