  signature: >-
    All about acting first. Gale Wings gives its Flying moves priority only at
    full HP, so its chance is the first hit; Quick Draw sometimes lets it move
    first anyway. Fake Out works only on its first turn, Me First steals the
    foe's own move, and After You and Quash decide who gets the next moment.
  new_move: null
