      Solar Beam, Weather Ball, Heat Wave, Overheat, Will-O-Wisp, Energy Ball, Giga Drain, Air Slash,
      Air Cutter, Aerial Ace, Acrobatics, Fly, Hurricane, Roost, Tailwind, U-turn, Defog, Bug Buzz,
      Signal Beam, Silver Wind, Struggle Bug, Pounce, Lunge, Leech Life, Infestation, Pollen Puff,
