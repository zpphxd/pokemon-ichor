line: icarus
species:

- dex: 100
  concept: Wax-winged moth
  name: Ikaroth
  etymology: Ikaros (Greek, Icarus) + moth
  category: Hubris
  types: [Bug, Flying]
  abilities: [Solar Power]
  hidden_ability: Weak Armor
  base_stats: {hp: 60, atk: 45, def: 50, spa: 120, spd: 60, spe: 110}
  ev_yield: {spa: 2}
  exp_yield: 152
  catch_rate: 75
  gender: {female_pct: 25}
  egg_groups: [Bug]
  egg_cycles: 15
  growth_rate: Medium Fast
  height_m: 1.1
  weight_kg: 4.8
  myth: >-
    Daedalus built wings of feathers bound with wax so that he and his son
    could escape Crete. Icarus ignored his father's warning, flew too near the
    sun, and fell into the sea when the wax melted (Ovid, Metamorphoses 8).
  expression: >-
    A moth that can't resist the sun, as moths can't resist a flame. Its wings
    are veined with wax, and in strong light the wax runs and the wings start to
    sag.
  art: >-
    Medium: it fills about 51×44 px. A moth climbing upward in three-quarter
    view facing left, its broad wings spread wide. The far wing is pale wax
    veined with sun-gold, and the dusk-bordered near forewing sags and drips wax
    from its edge where it is melting. A fluffy amber ruff around the thorax,
    feathery antennae, big sun-gold eyes and an olive-banded body. Marble and
    limestone wings with dusk borders, sun-gold wax with terracotta drips, an
    amber ruff, black-figure ink outline. Frame 2 beats the wings and lets a
    drip fall; the follower always drifts toward the brightest part of the
    screen.
  shiny: The wax turns Aegean blue, like the sea it falls into.
  dex_entry:
    - It flies toward the sun until the wax in
    - its wings begins to melt. It always falls,
    - and it always climbs again the next
    - sunny day.
  habitat: >-
    The cliffs below Daedalus's workshop on Knossa Isle, by day and only in
    harsh sunlight. Uncommon; it circles high over the cliff path and drops
    into the grass when its wings run.
  learnset:
    level_up:
      - [1, Gust]
      - [1, String Shot]
      - [5, Struggle Bug]
      - [9, Stun Spore]
      - [13, Air Cutter]
      - [17, Silver Wind]
      - [21, Morning Sun]
      - [25, Sunny Day]
      - [29, Signal Beam]
      - [33, Air Slash]
      - [37, Quiver Dance]
      - [41, Bug Buzz]
      - [45, Heat Wave]
      - [49, Solar Beam]
      - [53, Hurricane]
      - [57, Overheat]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sunny Day, Rain Dance,
      Solar Beam, Weather Ball, Heat Wave, Overheat, Will-O-Wisp, Energy Ball, Giga Drain, Air Slash,
      Air Cutter, Aerial Ace, Acrobatics, Fly, Hurricane, Roost, Tailwind, U-turn, Defog, Bug Buzz,
      Signal Beam, Silver Wind, Struggle Bug, Pounce, Lunge, Leech Life, Infestation, Pollen Puff,
      Psychic, Psybeam, Agility, Swift, Flash, Sky Attack, Hyper Beam, Giga Impact]
    egg: [Rage Powder, Baton Pass, Feather Dance, Sweet Scent, Mirror Move, Memento]
  signature: >-
    Solar Power and Sunny Day make it a fast, fragile sun sweeper that loses
    HP every sunny turn. Its last level-up move is Overheat, which leaves it
    weaker every time it reaches too high.
