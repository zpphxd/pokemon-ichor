line: moirai
species:

- dex: 143
  concept: The Spinner
  name: Nemira
  etymology: nema (Greek, thread) + Moira (Greek, Fate)
  category: Birth
  types: [Psychic, Fairy]
  abilities: [Levitate]
  hidden_ability: Triage
  base_stats: {hp: 90, atk: 60, def: 115, spa: 80, spd: 130, spe: 105}
  ev_yield: {def: 1, spd: 2}
  exp_yield: 300
  catch_rate: 3
  gender: {female_pct: 100}
  egg_groups: [Undiscovered]
  egg_cycles: 80
  growth_rate: Slow
  base_friendship: 35
  height_m: 0.9
  weight_kg: 11.0
  myth: >-
    The three Moirai, the Fates, allot every mortal a share of good and ill at
    birth (Hesiod, Theogony 217–222, 904–906). Klotho, the Spinner, spins each
    life's thread from her distaff, and in Plato she sings of the things that
    are (Republic 10.617b–c).
  expression: >-
    The first of the three sisters: the moment a thread begins. It is the
    gentlest of the trio and the hardest to wear down, because whatever is
    spun can be spun again.
  art: >-
    Large: she fills about 62×63 px with her wings and thread. A round,
    rose-white great bird in three-quarter view facing left, with a swan's neck,
    a crest of fleece curls, a gold beak, a masked almond eye and the trio's
    pink brow-gem. Her wings rise in a V of night-violet black-figure flight
    feathers flecked with stars, a bronze whorl is set in her breast, and the
    golden thread runs as a glowing seam down her neck and spine. Her tail
    twists into a spindle with a bronze whorl ring and a fine point, and the new
    thread loops away from its tip. Rose and marble plumage, night-violet wings,
    sun-gold thread, psychic-pink brow-gem, black-figure ink outline. Frame 2
    beats the wings; the back sprite shows the wings raised like a lyre over the
    spindle, and the follower floats with its thread trailing behind.
  shiny: Her rose plumage turns pale Aegean blue and the thread turns silver.
  dex_entry:
    - It spins a new thread the moment a life
    - begins. It is said that a baby who laughs
    - in its sleep has felt that thread tug.
    - For ages its wings were chained.
  habitat: >-
    Chained at the Loom of Fate under Delphoi until you cut the Fates free.
    In the Frozen Hour it waits at Elaia's festival shrine, where the island
    priestess reads each youth's thread. You rouse it there, and once time
    flows again it stays to be caught (static, level 60, one only).
  learnset:
    level_up:
      - [1, Confusion]
      - [1, Rest]
      - [1, String Shot]
      - [1, Fairy Wind]
      - [7, Imprison]
      - [14, Draining Kiss]
      - [21, Wish]
      - [28, Extrasensory]
      - [35, Future Sight]
      - [42, Sticky Web]
      - [49, Dazzling Gleam]
      - [56, Psychic]
      - [63, Calm Mind]
      - [70, Moonblast]
      - [77, Healing Wish]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Psychic, Psyshock,
      Psych Up, Calm Mind, Future Sight, Zen Headbutt, Expanding Force, Psychic Terrain, Trick,
      Skill Swap, Ally Switch, Light Screen, Reflect, Safeguard, Magic Room, Wonder Room, Gravity,
      Thunder Wave, Dream Eater, Swift, Helping Hand, Magic Coat, Shadow Ball, Energy Ball,
      Grass Knot, Charge Beam, Signal Beam, Rain Dance, Sunny Day, Recycle, Stored Power, Hyper Beam,
      Giga Impact, Dazzling Gleam, Draining Kiss, Misty Terrain, Charm, Disarming Voice,
      Alluring Voice, Baton Pass, Heal Bell, Mystical Fire, Psychic Noise, Pollen Puff, Bug Buzz,
      Icy Wind, Giga Drain, Nasty Plot]
    egg: []
  signature: >-
    The defensive one of the trio. It spins: String Shot at level 1 and Sticky
    Web at 42 lay its thread across the field. Wish, Draining Kiss and Healing
    Wish are new life, and Triage puts its healing first.
  new_move: null

- dex: 144
  concept: The Allotter
  name: Lotira
  etymology: lot + Moira (Greek, Fate; literally a share or portion)
  category: Lifespan
  types: [Psychic, Normal]
  abilities: [Levitate]
  hidden_ability: Unaware
  base_stats: {hp: 97, atk: 97, def: 97, spa: 97, spd: 97, spe: 97}
  ev_yield: {hp: 1, atk: 1, spa: 1}
  exp_yield: 300
  catch_rate: 3
  gender: {female_pct: 100}
  egg_groups: [Undiscovered]
  egg_cycles: 80
  growth_rate: Slow
  base_friendship: 35
  height_m: 1.0
  weight_kg: 13.0
  myth: >-
    Lachesis, the Allotter, measures out each thread and assigns every life its
    lot. In Plato's vision of the Spindle of Necessity she casts the lots for
    souls about to be born and sings of the things that were (Republic
    10.617b–618b).
  expression: >-
    The middle of the thread: a life, measured. Every one of its stats is the
    same, because the Allotter gives no part of itself more than its share.
  art: >-
    Large: she fills about 62×63 px, the tallest of the three. A stately pale
    crane in three-quarter view facing left, the trio's swan neck stretched
    forward under a straight quill crest, with a long gold beak, a masked eye
    and the pink brow-gem. Her raised wings have evenly ruled olive flight
    feathers flecked with gold, a bronze whorl sits in her breast, and the
    golden thread runs as a seam down her neck and spine. Her tail is one
    ruler-straight plume banded in bronze at every cubit, with the thread pulled
    taut along it. Limestone and marble plumage, olive wings, bronze bands,
    pale-gold thread, psychic-pink brow-gem, black-figure ink outline. Frame 2
    beats the wings; the back sprite shows the raised wings over the banded
    plume, and the follower holds its tail out level, as if measuring the path.
  shiny: Her pale plumage turns sun-gold and the thread turns terracotta red.
  dex_entry:
    - It measures each thread along its tail
    - and sets how long that life will run. It
    - has never given anyone more than their
    - share, and never one breath less.
  habitat: >-
    Chained at the Loom of Fate under Delphoi until you cut the Fates free.
    In the Frozen Hour it waits at the Pool of Mnemosyne, Arkadia, where the
    memory of every life is kept. You rouse it there, and once time flows again
    it stays to be caught (static, level 60, one only).
  learnset:
    level_up:
      - [1, Confusion]
      - [1, Rest]
      - [1, Bind]
      - [1, Swift]
      - [7, Imprison]
      - [14, Psybeam]
      - [21, Pain Split]
      - [28, Extrasensory]
      - [35, Future Sight]
      - [42, Guard Split]
      - [42, Power Split]
      - [56, Psychic]
      - [63, Tri Attack]
      - [70, Hyper Voice]
      - [77, Endeavor]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Psychic, Psyshock,
      Psych Up, Calm Mind, Future Sight, Zen Headbutt, Expanding Force, Psychic Terrain, Trick,
      Skill Swap, Ally Switch, Light Screen, Reflect, Safeguard, Magic Room, Wonder Room, Gravity,
      Thunder Wave, Dream Eater, Swift, Helping Hand, Magic Coat, Shadow Ball, Energy Ball,
      Grass Knot, Charge Beam, Signal Beam, Rain Dance, Sunny Day, Recycle, Stored Power, Hyper Beam,
      Giga Impact, Hyper Voice, Body Slam, Double-Edge, Tri Attack, Last Resort, Work Up,
      Echoed Voice, Uproar, Pain Split, Thunderbolt, Ice Beam, Flamethrower, Focus Blast,
      Stomping Tantrum, Iron Tail, Endeavor, Super Fang, Encore, Role Play]
    egg: []
  signature: >-
    The balanced one: 97 in every stat. Pain Split, Guard Split, Power Split and
    Endeavor all divide shares evenly, and Unaware means a foe's boosts never
    change the lot it was given.
  new_move: null

- dex: 145
  concept: The Cutter
  name: Thanira
  etymology: thanatos (Greek, death) + Moira (Greek, Fate)
  category: Death
  types: [Psychic, Ghost]
  abilities: [Levitate]
  hidden_ability: Sharpness
  base_stats: {hp: 75, atk: 130, def: 65, spa: 120, spd: 65, spe: 125}
  ev_yield: {atk: 2, spe: 1}
  exp_yield: 300
  catch_rate: 3
  gender: {female_pct: 100}
  egg_groups: [Undiscovered]
  egg_cycles: 80
  growth_rate: Slow
  base_friendship: 35
  height_m: 0.9
  weight_kg: 10.5
  myth: >-
    Atropos, "the unturnable", cuts each thread when its measure is reached,
    and no god can undo her cut. In Plato she sings of the things that are to
    be, and makes the threads that are spun irreversible (Republic
    10.617c–620e).
  expression: >-
    The end of the thread. It is the fastest and most dangerous of the three,
    but not cruel: it only finishes what its sisters began.
  art: >-
    Large: she fills about 62×62 px. A gaunt, hunched night-violet bird like a
    hooded crow, in three-quarter view facing left, with a feathered hood drawn
    over a heavy-lidded eye, a hooked gold beak and the pink brow-gem. Her
    ragged, knife-edged wings rise in a V, a bronze whorl sits in her breast,
    and the golden thread runs as a seam down her neck and spine. Her tail
    splits into two steel blade feathers that cross like shears, and the thread
    is cut clean where they meet, its loose end curling away in a spiral of
    sparks. Night-violet and ink plumage, steel-gray blades, sun-gold thread,
    psychic-pink brow-gem, black-figure ink outline. Frame 2 beats the wings;
    the back sprite shows the hood under the raised wings with the shears below,
    and the follower snips the air now and then.
  shiny: Her night-violet plumage turns marble white and her shears turn bright silver.
  dex_entry:
    - Its shears cut the thread at the end of
    - every life, and nothing can turn them
    - aside. It does not hate the living. It
    - only keeps the promise its sisters made.
  habitat: >-
    Chained at the Loom of Fate under Delphoi until you cut the Fates free.
    In the Frozen Hour it waits at Kaldera's forge, where you learned the Harpe
    can cut what the Fates have woven. You rouse it there, and once time flows
    again it stays to be caught (static, level 60, one only).
  learnset:
