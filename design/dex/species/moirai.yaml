      - [1, Rest]
      - [1, Fury Cutter]
      - [1, Astonish]
      - [7, Imprison]
      - [14, Shadow Sneak]
      - [21, Psycho Cut]
      - [28, Extrasensory]
      - [35, Future Sight]
      - [42, Night Slash]
      - [49, X-Scissor]
      - [56, Destiny Bond]
      - [63, Phantom Force]
      - [70, Perish Song]
      - [77, Guillotine]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Psychic, Psyshock,
      Psych Up, Calm Mind, Future Sight, Zen Headbutt, Expanding Force, Psychic Terrain, Trick,
      Skill Swap, Ally Switch, Light Screen, Reflect, Safeguard, Magic Room, Wonder Room, Gravity,
      Thunder Wave, Dream Eater, Swift, Helping Hand, Magic Coat, Shadow Ball, Energy Ball,
      Grass Knot, Charge Beam, Signal Beam, Rain Dance, Sunny Day, Recycle, Stored Power, Hyper Beam,
