    the horn of plenty. Her hide became the aegis, which raised thunderstorms
    when Zeus shook it (Ovid, Fasti 5; Hyginus, Astronomica 2.13).
  expression: >-
    The nurse goat grown into a storm. One horn is snapped short and pours out
    fruit that never runs out, and its fleece has become a thundercloud.
  art: >-
    Large: it fills about 52×56 px. A noble she-goat standing tall in
    three-quarter view facing left, chest out and head lifted. Her left horn
    sweeps back long and curved; the right is broken off short, and grapes,
    figs and a pomegranate spill from the break. Her fleece billows into a
    rolling thundercloud along her back, veined with lightning, over slim legs
    and a gentle face with a goatee. Marble-gray cloud with Aegean-blue
    shadows, sun-gold lightning, olive and terracotta fruit with one soft pink
    Fairy accent on the figs, limestone face and legs, black-figure ink
    outline. The follower leaves a trail of falling fruit that vanishes.
