- dex: 26
  concept: Storm kid
  name: Eripip
  etymology: eriphos (Greek, kid goat) + pip
  category: Static Kid
  types: [Electric]
  abilities: [Static, Cute Charm]
  hidden_ability: Harvest
  base_stats: {hp: 30, atk: 30, def: 25, spa: 50, spd: 40, spe: 45}
  ev_yield: {spa: 1}
  exp_yield: 44
  catch_rate: 190
  gender: {female_pct: 75}
  egg_groups: [Undiscovered]
  egg_cycles: 10
  growth_rate: Medium Fast
  base_friendship: 70
  height_m: 0.3
  weight_kg: 3.5
  myth: >-
    Rhea hid the infant Zeus from Kronos in a cave on Crete, where the goat
    Amalthea suckled him and the Kouretes clashed their shields to drown out
    his crying (Callimachus, Hymn to Zeus; Apollodorus, Library 1.1.6).
  expression: >-
    A kid all fleece and no horns yet, the kind of soft, noisy thing a baby
    god could be hidden in. Its static is a warning to anyone who comes too
    close.
  art: >-
    Small: it fills about 30×30 px. A round, fluffy kid standing stiff-legged
    in three-quarter view facing left, its oversized puffball fleece crackling
    with tiny zigzag sparks. Floppy ears, four little hooves, a stub tail, no
    horns, and huge shining eyes. Marble-white fleece shaded with limestone,
    sun-gold sparks with one pale Aegean-blue highlight, limestone muzzle and
    hooves, black-figure ink outline. The follower pronks, bouncing on all four
    legs at once.
  shiny: Its fleece turns pale Aegean blue and its sparks marble white.
  dex_entry:
    - Its fleece crackles with static, so it
    - sleeps curled up in caves. Goatherds say
    - a child who naps beside one cannot be
    - found by anyone who means it harm.
  habitat: >-
    Hatches from eggs bred from Kerazap or Kerastorm. It isn't found in the
    wild.
  learnset:
    level_up:
      - [1, Thunder Shock]
      - [1, Tail Whip]
      - [1, Charm]
      - [4, Play Nice]
      - [7, Nuzzle]
      - [10, Sweet Kiss]
      - [13, Charge]
      - [16, Thunder Wave]
      - [19, Spark]
      - [22, Baby-Doll Eyes]
      - [25, Nasty Plot]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Charm, Thunder Wave,
      Thunderbolt, Thunder, Charge Beam, Volt Switch, Electro Ball, Shock Wave, Electroweb,
      Discharge, Wild Charge, Electric Terrain, Rain Dance, Light Screen, Reflect, Helping Hand,
      Covet, Fake Tears, Disarming Voice, Draining Kiss, Grass Knot, Headbutt, Iron Tail,
      Thunder Punch, Mud-Slap, Rock Climb, Natural Gift, Fling, Take Down, Body Slam]
    egg: [Wish, Present, Bestow, Encore, Tickle, Reversal, Lucky Chant]
  signature: >-
    Nuzzle at 7 and Charm from the start: it paralyzes its friends by cuddling
    them. It evolves from friendship, not training.
  new_move: null

