    goatee that crackles. Marble-white fleece with marble-gray cloud shading,
    sun-gold horn tips and sparks, limestone face and legs, black-figure ink
    outline. The follower trots ahead and headbutts the player's leg.
  shiny: Its fleece turns pale Aegean blue and its horn sparks marble white.
