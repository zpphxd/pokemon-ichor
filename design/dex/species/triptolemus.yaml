line: triptolemus
species:

- dex: 50
  concept: Wheat serpent
  name: Stachyss
  etymology: stachys (Greek, ear of wheat) + hiss
  category: Wheat Snake
  types: [Grass]
  abilities: [Shed Skin, Harvest]
  hidden_ability: Seed Sower
  base_stats: {hp: 55, atk: 62, def: 50, spa: 48, spd: 50, spe: 45}
  ev_yield: {atk: 1}
  exp_yield: 62
  catch_rate: 120
  gender: {female_pct: 50}
  egg_groups: [Grass, Dragon]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 1.2
  weight_kg: 7.5
  myth: >-
    When Demeter ended her mourning, she gave Triptolemus of Eleusis seed
    grain and a winged chariot drawn by serpents, and sent him across the
    world to teach mortals to sow and reap (Ovid, Metamorphoses 5; Apollodorus
    1.5.2).
  expression: >-
    One of the chariot's serpents before it has wings. Ripe wheat grows along
    its spine, and where it sheds its skin the furrow sprouts.
  art: >-
    Small: it fills about 40×30 px, coiled low. A slim serpent in
    three-quarter view facing left, raised in an S-curve with its head tilted
    curiously. A row of golden wheat ears grows along its spine like a crest,
    and two long awns curl back from its head like a hood. Smooth scales, a
    pale belly and round, friendly eyes. Olive scales, sun-gold wheat,
    limestone belly, black-figure ink outline. The follower winds along behind
    the player, leaving a trail of seed.
  shiny: Its scales turn terracotta and its wheat pale marble.
  dex_entry:
    - It slides through the wheat unseen, for
    - the ears on its back look just like the
    - crop. Any field it lives in grows thick.
  habitat: >-
    Common in Eleusa Village's wheat fields by day, hidden among the crop.
  learnset:
    level_up:
      - [1, Wrap]
      - [1, Leafage]
      - [5, Growth]
      - [8, Leech Seed]
      - [11, Bullet Seed]
      - [14, Glare]
      - [17, Synthesis]
      - [20, Coil]
      - [23, Seed Bomb]
      - [26, Worry Seed]
      - [29, Grassy Terrain]
      - [32, Leaf Blade]
      - [36, Power Whip]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Sunny Day,
      Grassy Terrain, Bullet Seed, Seed Bomb, Magical Leaf, Energy Ball, Giga Drain, Grass Knot,
      Solar Beam, Solar Blade, Trailblaze, Grassy Glide, Worry Seed, Nature Power, Dig, Iron Tail,
      Dragon Tail, Scary Face, Body Slam, Take Down, Helping Hand, Swift]
    egg: [Rototiller, Ingrain, Sucker Punch, Strength Sap, Aromatherapy, Wring Out]
  signature: >-
    Harvest regrows its Berry, and Seed Sower spreads Grassy Terrain whenever
    it is hit. Leech Seed and Bullet Seed come early: it sows from its first
    battle.
  new_move: null

