- dex: 89
  concept: Foam scallop
  name: Aphrell
  etymology: aphros (Greek, sea foam) + shell
  category: Foam Shell
  types: [Water]
  abilities: [Shell Armor, Cute Charm]
  hidden_ability: Hydration
  base_stats: {hp: 45, atk: 40, def: 85, spa: 55, spd: 60, spe: 35}
  ev_yield: {def: 1}
  exp_yield: 61
  catch_rate: 190
  gender: {female_pct: 75}
  egg_groups: [Water 3, Fairy]
  egg_cycles: 20
  growth_rate: Fast
  base_friendship: 70
  height_m: 0.4
  weight_kg: 7.5
  myth: >-
    Aphrodite was born from the sea foam, aphros, and came ashore first at
    Kythera and then at Cyprus (Hesiod, Theogony 188–200). Art shows her riding
    a scallop shell.
  expression: >-
    The scallop before the birth, just opening as it rides the foam toward
    Kythera.
  art: >-
    Small: it fills about 42×43 px. A little rose-pink creature peeking out of
    an open scallop in three-quarter view facing left, riding a curl of sea
    foam. The upper valve tilts up over its round face like a fan and the lower
    valve cups its body, their fluted ribs fanning out from the hinge. Big dark
    eyes and a small smile. Marble and pale terracotta shell with Aegean-blue
    lines between the ribs, a rose-pink body, marble-white foam over Aegean-blue
    water, black-figure ink outline. Frame 2 closes its eyes in a smile; the
    follower claps its shell to hop along.
  shiny: Its shell turns sun-gold with pearl-white ribs.
  dex_entry:
    - It drifts in on the surf, peeking out of
    - its shell. When it opens wide, the foam
    - that spills out smells of roses.
  habitat: >-
    Common on Kythera's sea-foam beaches, washed up with the morning tide.
    Fishing in the surf turns up more at any hour.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Withdraw]
      - [4, Bubble]
      - [8, Clamp]
      - [12, Fairy Wind]
      - [16, Aqua Ring]
      - [20, Bubble Beam]
      - [24, Mist]
      - [28, Water Pulse]
      - [32, Brine]
      - [36, Soak]
      - [40, Hydro Pump]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
