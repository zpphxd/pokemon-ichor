      Snowscape, Surf, Dive, Whirlpool, Brine, Water Pulse, Scald, Chilling Water, Ice Beam,
      Icy Wind, Blizzard, Iron Defense, Light Screen, Safeguard, Charm, Draining Kiss,
      Misty Terrain, Helping Hand, Hydro Pump, Muddy Water, Captivate]
    egg: [Shell Smash, Rapid Spin, Wish, Lucky Chant, Refresh, Aqua Jet]
  signature: >-
    Shell Armor and a high Defense keep it shut tight. Shell Smash, an egg
    move, throws it open.
  new_move: null

