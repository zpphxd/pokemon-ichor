line: polybotes
species:

- dex: 83
  concept: Smoldering cinder
  name: Kapnub
  etymology: kapnos (Greek, smoke) + nub
  category: Cinder
  types: [Fire]
  abilities: [Magma Armor, Solid Rock]
  hidden_ability: White Smoke
  base_stats: {hp: 50, atk: 60, def: 68, spa: 52, spd: 40, spe: 30}
  ev_yield: {def: 1}
  exp_yield: 60
  catch_rate: 190
  gender: {female_pct: 50}
  egg_groups: [Mineral]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 0.4
  weight_kg: 18.0
  myth: >-
    In the war of the Giants, Poseidon tore a piece off the island of Kos and
    threw it on the giant Polybotes. It became the volcanic island of Nisyros
    (Apollodorus, Library 1.6.2).
  expression: >-
    A spark of the giant's breath, broken off and wandering. It smolders the
    way the island's vents do.
  art: >-
    Small: it fills about 28×28 px. A lump of cooling cinder in three-quarter
    view facing left, with two glowing eye-slits and stubby nubs for arms.
    Orange light shows through cracks in its crust, and a thin curl of smoke
    rises from its crown. Black-figure ink and dark gray crust, terracotta and
    sun-gold glow in the cracks, marble-gray smoke. The follower rolls along
    behind the player, trailing smoke.
  shiny: Its crust turns ash-pale and the glow in its cracks turns blue.
  dex_entry:
    - It smolders day and night. Kaldera folk
    - say each one is a spark of a giant's
    - breath, still trying to find its way home
    - to him under the ground.
  habitat: >-
    Common on the floor of Kaldera's caldera, among the smoking vents, by day
    and by night, at levels 34–35. Team Titan grunts collect them.
  learnset:
    level_up:
      - [1, Ember]
      - [1, Smokescreen]
      - [4, Defense Curl]
      - [8, Rollout]
      - [12, Flame Charge]
      - [16, Rock Tomb]
      - [20, Clear Smog]
      - [24, Lava Plume]
      - [28, Rock Slide]
      - [32, Yawn]
      - [36, Stealth Rock]
      - [40, Heat Crash]
      - [44, Eruption]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sunny Day, Sandstorm,
      Flamethrower, Fire Blast, Overheat, Will-O-Wisp, Fire Spin, Flame Charge, Heat Crash,
      Incinerate, Temper Flare, Scorching Sands, Rock Tomb, Rock Slide, Stone Edge, Rock Blast,
      Smack Down, Stealth Rock, Rock Polish, Ancient Power, Earth Power, Bulldoze, Earthquake,
      Dig, Curse, Gyro Ball, Explosion, Self-Destruct, Heavy Slam, Iron Defense, Body Press,
      Rollout, Defense Curl, Endeavor]
    egg: [Magnitude, Burn Up, Body Slam, Flail, Inferno, Amnesia]
  signature: >-
    A slow, sturdy cinder that opens with Smokescreen and Rollout. White Smoke
    keeps its stats from falling, and it learns Eruption late.
  new_move: null

- dex: 84
  concept: Buried giant
  name: Gigantomb
  etymology: gigas (Greek, giant) + tomb
  category: Buried Giant
  types: [Fire, Rock]
  abilities: [Magma Armor, Solid Rock]
  hidden_ability: White Smoke
  base_stats: {hp: 105, atk: 105, def: 115, spa: 95, spd: 65, spe: 20}
  ev_yield: {def: 2}
  exp_yield: 184
  catch_rate: 60
  gender: {female_pct: 50}
  egg_groups: [Mineral]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 3.2
  weight_kg: 880.0
  myth: >-
    Poseidon buried the giant Polybotes under a piece of Kos, which became the
    island of Nisyros. The smoke of its volcano is said to be the giant's
    breath (Apollodorus, Library 1.6.2; Strabo 10.5.16).
  expression: >-
    The giant himself, pinned under his island. People farm his back without
    knowing it, and his breath comes up as smoke.
  art: >-
    Huge: it fills the 64×64 box. A giant's head and shoulders in three-quarter
    view facing left, breaking out of the ground with both fists braced on the
    earth. A crag head with a jutting brow, horn-like crags and a heavy jaw, its
    eyes and furnace maw glowing around two fangs, and one curling smoke plume
    rising behind it. Its back is a rocky island: a small hill with a
    whitewashed hut, an Aegean-blue door, a smoking chimney and two olive trees.
    Dark basalt skin in ink and marble-gray, terracotta and sun-gold cracks, a
    limestone island with marble, olive and Aegean-blue details, black-figure
    ink outline. Frame 2 flares the maw and curls the smoke; the back sprite
    shows the hut's chimney smoking.
  shiny: Its skin turns ash-white, its cracks glow blue, and the hut door turns terracotta.
  dex_entry:
    - A whole island rests on its back, hut and
    - all. The shepherds who live there think
    - the smoke on the hill is a chimney. It is
    - the breath of the giant underneath.
  habitat: >-
    Evolves from Kapnub at level 35. Rare in the wild, half-buried in the floor
    of Kaldera's caldera. Admin Hyperion of Team Titan keeps one as his ace.
  learnset:
    level_up:
      - [0, Ancient Power]
      - [1, Ember]
      - [1, Smokescreen]
      - [1, Defense Curl]
      - [1, Rollout]
      - [12, Flame Charge]
      - [16, Rock Tomb]
      - [20, Clear Smog]
      - [24, Lava Plume]
      - [28, Rock Slide]
      - [32, Yawn]
      - [38, Stealth Rock]
      - [42, Heat Crash]
      - [46, Earth Power]
      - [50, Stone Edge]
      - [54, Eruption]
      - [60, Rock Wrecker]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sunny Day, Sandstorm,
      Flamethrower, Fire Blast, Overheat, Will-O-Wisp, Fire Spin, Flame Charge, Heat Crash,
      Incinerate, Temper Flare, Scorching Sands, Rock Tomb, Rock Slide, Stone Edge, Rock Blast,
      Smack Down, Stealth Rock, Rock Polish, Ancient Power, Earth Power, Bulldoze, Earthquake,
      Dig, Curse, Gyro Ball, Explosion, Self-Destruct, Heavy Slam, Iron Defense, Body Press,
      Rollout, Defense Curl, Endeavor, Hyper Beam, Giga Impact, Fire Punch, Focus Punch,
      Superpower, Brick Break, Meteor Beam, Power Gem, Heat Wave, Solar Beam, Stomping Tantrum,
      High Horsepower]
    egg: []
  signature: >-
    Hyperion's ace hits hard from full health with Eruption and shrugs off hits
    with high HP and Defense. Its Speed of 20 suits Trick Room, but Water and
    Ground both hit it four times over.
  new_move: null
