line: stoneborn
species:

- dex: 23
  concept: Thrown pebble
  name: Pebblith
  etymology: pebble + lithos (Greek, stone)
  category: Pebble
  types: [Rock, Ground]
  abilities: [Rock Head, Sturdy]
  hidden_ability: Sand Force
  base_stats: {hp: 40, atk: 78, def: 95, spa: 30, spd: 32, spe: 25}
  ev_yield: {def: 1}
  exp_yield: 60
  catch_rate: 255
  gender: {female_pct: 50}
  egg_groups: [Mineral]
  egg_cycles: 15
  growth_rate: Medium Slow
  height_m: 0.3
  weight_kg: 18.0
  myth: >-
    After Zeus's flood, Deucalion and Pyrrha were told to throw their mother's
    bones behind them. They threw the stones of Mother Earth over their
    shoulders, and the stones softened into people (Ovid, Metamorphoses 1).
  expression: >-
    A stone that was thrown and hasn't finished landing. It has a face and two
    nubs for hands, and a pale handprint on its back where it was gripped.
  art: >-
    Very small: it fills about 30×26 px. A smooth, egg-shaped river pebble in
    three-quarter view facing left, tilted forward as if still tumbling, with
    two stubby stone nubs for hands and a determined little face. A chalk-pale
    handprint is pressed into its back, and a crust of terracotta earth clings
    to its base. Marble grays with limestone highlights, a terracotta Ground
    accent, black-figure ink outline. The follower rolls end over end.
  shiny: The stone turns terracotta red and the handprint sun-gold.
  dex_entry:
    - Old shepherds say each one was thrown
    - over a shoulder long ago, and that it has
    - been trying to grow into a person ever
    - since.
  habitat: >-
    Kronion Hill's ruins and the sea caves of Kalliste Isle, day and night.
    Very common in caves, and it often tumbles out of rocks broken with the
    Bronze Hammer. Team Titan grunts digging on Kronion Hill carry them.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Defense Curl]
      - [4, Mud-Slap]
      - [6, Rock Throw]
      - [10, Rollout]
      - [12, Rock Polish]
      - [16, Rock Tomb]
      - [18, Bulldoze]
      - [22, Stealth Rock]
      - [24, Rock Slide]
      - [28, Dig]
      - [30, Double-Edge]
      - [34, Stone Edge]
      - [38, Earthquake]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Natural Gift, Fling, Rock Smash,
      Strength, Rollout, Defense Curl, Mud-Slap, Rock Tomb, Rock Slide, Stone Edge, Rock Blast,
      Smack Down, Rock Polish, Stealth Rock, Sandstorm, Sand Tomb, Dig, Bulldoze, Earthquake,
      Stomping Tantrum, Scorching Sands, Brick Break, Fire Punch, Thunder Punch, Iron Defense,
      Gyro Ball, Heavy Slam, Block, Counter, Seismic Toss, Ancient Power, Take Down, Double-Edge,
      Body Slam, Focus Punch]
    egg: [Curse, Flail, Wide Guard, Mega Punch, Rock Climb, Autotomize, Hammer Arm]
  signature: >-
    It's thrown before it can walk. Rock Throw comes at 6 and Stealth Rock at
    22, scattering stones that are, in a sense, its family.
  new_move: null

- dex: 24
  concept: Cairn
  name: Cairnolith
  etymology: cairn + lithos (Greek, stone)
  category: Cairn
  types: [Rock, Ground]
  abilities: [Rock Head, Sturdy]
  hidden_ability: Sand Force
  base_stats: {hp: 55, atk: 95, def: 115, spa: 40, spd: 45, spe: 40}
  ev_yield: {def: 2}
  exp_yield: 137
  catch_rate: 120
  gender: {female_pct: 50}
  egg_groups: [Mineral]
  egg_cycles: 15
  growth_rate: Medium Slow
  height_m: 1.1
  weight_kg: 110.0
  myth: >-
    The stones thrown by Deucalion became men and those thrown by Pyrrha became
    women. The Greeks heard the story in their own words, laas (stone) and laos
    (people) (Apollodorus, Library 1.7.2).
  expression: >-
    Half heap and half body: the roadside cairn that every traveler adds a
    stone to, standing up to walk. Its people-shape is still being stacked.
  art: >-
    Medium: it fills about 42×52 px. A balanced stack of five flat stones,
    largest at the bottom, in three-quarter view facing left, standing on two
    stumpy stone legs with two short stone arms jutting from the middle stones.
    Its face sits on the second stone from the top, and a small pebble perches
    on the summit like a hat. Marble and limestone stones of slightly different
    grays, one terracotta stone, olive lichen spots, black-figure ink outline.
    The follower sways as it walks, the top pebble wobbling.
  shiny: Every stone turns terracotta red, with sun-gold lichen.
  dex_entry:
    - It stands by mountain roads. Each stone
    - a traveler leaves becomes part of it.
    - By dawn it stands a little farther down
    - the road than it did at dusk.
  habitat: >-
    Evolves from Pebblith at level 25. Wild ones stand beside the mainland's
    mountain roads and in the deeper caves of Kalliste Isle, uncommon, mostly
    at dusk.
  learnset:
    level_up:
      - [0, Rock Blast]
      - [1, Tackle]
      - [1, Defense Curl]
      - [1, Mud-Slap]
      - [1, Rock Throw]
      - [10, Rollout]
      - [12, Rock Polish]
      - [16, Rock Tomb]
      - [18, Bulldoze]
      - [22, Stealth Rock]
      - [24, Rock Slide]
      - [28, Sandstorm]
      - [30, Dig]
      - [34, Iron Defense]
      - [38, Double-Edge]
      - [44, Stone Edge]
      - [50, Earthquake]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Natural Gift, Fling, Rock Smash,
      Strength, Rollout, Defense Curl, Mud-Slap, Rock Tomb, Rock Slide, Stone Edge, Rock Blast,
      Smack Down, Rock Polish, Stealth Rock, Sandstorm, Sand Tomb, Dig, Bulldoze, Earthquake,
      Stomping Tantrum, Scorching Sands, Brick Break, Fire Punch, Thunder Punch, Iron Defense,
      Gyro Ball, Heavy Slam, Block, Counter, Seismic Toss, Ancient Power, Take Down, Double-Edge,
      Body Slam, Focus Punch, Body Press, Endeavor]
    egg: []
  signature: >-
    It learns Rock Blast on evolving, a volley of the stones travelers have
    added to it. Slow, heavy and very hard to topple.
  new_move: null

- dex: 25
  concept: Stoneborn
  name: Laolith
  etymology: laos (Greek, people) + lithos (Greek, stone)
  category: Stoneborn
  types: [Rock, Fighting]
  abilities: [Rock Head, Sturdy]
  hidden_ability: Iron Fist
  base_stats: {hp: 85, atk: 130, def: 115, spa: 45, spd: 70, spe: 55}
  ev_yield: {atk: 3}
  exp_yield: 227
  catch_rate: 45
  gender: {female_pct: 50}
  egg_groups: [Mineral]
  egg_cycles: 15
  growth_rate: Medium Slow
  height_m: 1.7
  weight_kg: 260.0
  myth: >-
    Thrown over the shoulder by Deucalion and Pyrrha, the stones of Mother
    Earth lost their hardness and took human shape, and from them came a hardy
    race of people (Ovid, Metamorphoses 1; Apollodorus, Library 1.7.2).
  expression: >-
    The stone has become a person, caught mid-stride and turning to look back
    at whoever threw it. The handprint on its back is its only memory of where
    it came from.
  art: >-
    Large: it fills about 60×60 px. A humanoid of fitted stone blocks striding
    forward to the left, torso twisted so its head looks back toward the
    viewer's right, peering over its near shoulder. Seams between the blocks mark its
    joints, its fists are heavy rounded boulders bound in terracotta cord, and
    one heel is still lifted mid-step. Marble and limestone stone with darker
    marble seams, terracotta cord wraps, black-figure ink outline. The back
    sprite shows the large chalk-pale handprint between its shoulder blades.
  shiny: Its stone turns terracotta red and the handprint sun-gold.
  dex_entry:
    - It walks like a person, but it keeps
    - glancing back over its shoulder, as if
    - to see who threw it. The oldest villages
    - are said to have been built by its kind.
  habitat: Evolves from Cairnolith when traded. It isn't found in the wild.
  learnset:
