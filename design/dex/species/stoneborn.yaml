      - [50, Earthquake]
      - [54, Hammer Arm]
      - [60, Head Smash]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Natural Gift, Fling, Rock Smash,
      Strength, Rollout, Defense Curl, Mud-Slap, Rock Tomb, Rock Slide, Stone Edge, Rock Blast,
