  concept: Six-headed snatcher
  name: Hexylla
  etymology: hex (Greek, six) + Skylla (Greek, Scylla)
  category: Six-Necked
  types: [Water, Dark]
  abilities: [Strong Jaw, Intimidate]
  hidden_ability: Moxie
