  myth: >-
    Scylla was a nymph until Circe poisoned her bathing pool and turned her into
    a monster (Ovid, Metamorphoses 14.1–74). She lives in a cave over the strait
    with six long necks, each with a head and three rows of teeth, and yelps like
    a newborn pup; she took six of Odysseus's men as he passed (Odyssey
    12.85–100, 245–259).
  expression: >-
    The six-headed snatcher of the strait, and one half of a pair: it watches
    Trybdis's whirlpool from across the water and catches whatever steers away
    from it. Six heads means six bites, and it never takes fewer.
  art: >-
    Large: it fills about 58×60 px. A squat sea-anemone body clamped to a rock
    ledge in three-quarter view facing left, with six long, snaking necks
    rising from it, each ending in a small dog's head with pricked ears and
    bared teeth, all turned different ways. A ring of anemone tentacles at the
    base, like a skirt. Aegean-blue and deep-blue body, terracotta dog heads with
    marble teeth, a dark violet Dark-type accent on the necks, black-figure ink
    outline. The back sprite shows the necks fanned out; the follower's heads
    snap at passing birds.
  shiny: The body turns cypress green and the heads turn marble white.
  dex_entry:
    - Its six heads yelp like newborn pups.
    - Captains who fear Trybdis across the
    - strait steer close to its cliff instead,
    - and lose six sailors rather than all.
  habitat: >-
    The cliff caves on the Scylla side of the strait, on the post-game Odyssey
    (uncommon, day and night). It lunges at the trireme as it passes; fish from
    the deck near the cliff to find one.
