  myth: >-
    In the drawing of lots Poseidon won the gray sea to live in forever (Iliad
    15.187–193). Homer calls him the Earth-shaker, and when he takes up his
    trident the clouds pile up and every wind blows at once (Odyssey
    5.291–296). The bronze god hauled from a wreck off Cape Artemision, arm
    drawn back to throw, is often read as him.
  expression: >-
    The bronze from the wreck, become the sea. It wears the Corinthian helm and
    cuirass the Cyclopes forged for all three brothers, green with verdigris,
    and below them it is a breaking wave, its raised hand a trident of water.
    Like its brothers it has only its lot's emblem, a glowing trident, for a
    face.
  art: >-
    Largest: it fills about 60×61 px. A sea titan rising out of a curling wave
    in three-quarter view facing left, the wave climbing up behind it and
    breaking over its head. It wears the brothers' Corinthian helm and muscled
    cuirass in sea-green verdigris, with a fin-shaped crest of water sweeping
    back from the helm and a glowing trident in the visor's T. One arm is raised
    high and its hand becomes a trident of water; the other dissolves into the
    surf. Cypress and sea-green verdigris, a bronze meander belt, Aegean blues
    for the wave with marble-white foam, a sea-foam aqua glow, black-figure ink
    outline. Frame 2 surges the wave and lifts the trident; the back sprite
    shows the helm and crest inside the curl of the wave, and the follower
    leaves wet footprints.
  shiny: The verdigris is scoured off, leaving bright new bronze, and the visor's trident glows pale gold.
  dex_entry:
    - Sponge divers found it in a wreck, its arm
    - drawn back to throw. When it strikes the
    - seabed with its spear, islands shake and
    - the sea climbs over the harbor walls.
  habitat: >-
    Atlantis, in the drowned temple at the heart of the sunken city (post-game;
    suggested). Its doors stay sealed until you hold the trident lot, which
    Kronolith gives back at the Omphalos in Delphoi; then you Dive to it, day or
    night (static, level 70, one only).
