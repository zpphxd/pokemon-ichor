  myth: >-
    In the drawing of lots Poseidon won the gray sea to live in forever (Iliad
    15.187–193). Homer calls him the Earth-shaker, and when he takes up his
    trident the clouds pile up and every wind blows at once (Odyssey
    5.291–296). The bronze god hauled from a wreck off Cape Artemision, arm
    drawn back to throw, is often read as him.
  expression: >-
    The bronze god from the wreck, still in its throwing pose, walking up out
    of the sea with its trident drawn back. Barnacles and coral crust it, and
    like its brothers it has only its lot's emblem, a glowing trident, for a
    face.
  art: >-
    Largest: it fills about 62×62 px. A striding bronze colossus in
    three-quarter view facing left, in the Artemision pose: left arm stretched
    straight ahead, right arm drawn far back holding a trident ready to throw,
    legs braced wide. Where its face should be is a flat bronze plate with a
    trident picked out in glowing points, and a beard of green weed hangs below
    it. Barnacles and knots of coral crust its shoulders, shins and the
    trident's shaft. Aegean blue and cypress for the green patina, sun-gold
    where bare bronze shows through, limestone barnacles, terracotta coral, a
    sea-foam green glow on the face points, black-figure ink outline; the
    follower leaves wet footprints.
  shiny: The patina is scoured off, leaving bright new bronze in sun-gold and marble-white barnacles.
  dex_entry:
    - Sponge divers found it in a wreck, its arm
    - drawn back to throw. When it strikes the
    - seabed with its spear, islands shake and
    - the sea climbs over the harbor walls.
  habitat: >-
    Atlantis, in the drowned temple at the heart of the sunken city (post-game;
    suggested). Its doors stay sealed until you hold the trident lot, which
    Kronolith gives back at the Omphalos in Delphoi; then you Dive to it, day or
    night (static, level 70, one only).
