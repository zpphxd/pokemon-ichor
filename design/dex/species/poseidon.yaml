- dex: 150
  concept: Sea colossus
  name: Pontanax
  etymology: pontos (Greek, the open sea) + anax (Greek, lord, king)
  category: Sea Lord
  types: [Water]
  abilities: [Clear Body]
  hidden_ability: Swift Swim
  base_stats: {hp: 100, atk: 200, def: 110, spa: 50, spd: 90, spe: 50}
