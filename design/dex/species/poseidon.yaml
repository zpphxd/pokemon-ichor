  signature: >-
    The Earth-shaker. Lock-On at 42 and Fissure at 54 split the ground for a
    sure knockout, its answer to the Regis' Lock-On and Zap Cannon, and its huge
    Attack drives Wave Crash and Earthquake. Swift Swim lets the slow colossus
    move like a storm tide when it rains.
