      Magic Room, Wonder Room, Gravity, Telekinesis, Embargo, Snatch, Uproar, Hyper Beam]
    egg: [Teeter Dance, Curse, Memento, Grudge, Disable]
  signature: >-
    Illusion: it enters disguised as the last Pokémon in its party, and
    Thespis always leads with it. Hypnosis and Perish Song let it stage a
    tragedy whose ending everyone in the audience already knows.
  new_move: null
