    facing left, sitting back on its haunches and hugging an overflowing horn
    of plenty to its belly. Wheat, figs and a few coins spill from the horn's
    mouth. Its eyes are still closed seams, with a contented smile under a
    long snout. Cypress-dark fur with a limestone belly, terracotta paws and
    snout, a limestone-and-sun-gold horn spilling olive figs and wheat,
    black-figure ink outline. The follower drops a grain behind it now and
    then.
  shiny: Its fur turns sun-gold and its horn marble white.
  dex_entry:
