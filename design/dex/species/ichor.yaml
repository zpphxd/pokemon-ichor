  myth: >-
    Ichor is the golden blood of the gods: they eat no bread and drink no wine,
    so they are bloodless and immortal, and ichor ran from Aphrodite's wound at
    Troy (Iliad 5.339–342). The bronze giant Talos held his life in a single
    vein of it, sealed at the ankle (Apollonius, Argonautica 4.1638–1648).
  expression: >-
    The title Pokémon and Aethos's Mew: one drop of the blood every god shares,
    so it can become any of them. Professor Daphne says every myth is a memory
    of a Pokémon; this is the memory the first myth came from.
  art: >-
    Small: it fills about 30×36 px. A floating golden being shaped like a
    falling drop in three-quarter view facing left, round at the bottom and
    curling to a fine point at the top like a drip about to fall. Two tiny
    arms, big calm eyes, and a long thin tail that trails off like a running
    drop, with a small bronze nail mark near its tip. Sun-gold body shading to
    terracotta in shadow, marble-white highlights, a faint psychic-pink shimmer
    on its edge, black-figure ink outline. The follower bobs in the air and
    leaves a brief glint behind it.
  shiny: The gold turns quicksilver white with pale Aegean-blue shading.
  dex_entry:
    - A drop of the golden blood that runs in
    - the gods. Every myth is a memory, it is
    - said, and this one remembers the first.
    - It can take the shape of any Pokémon.
  habitat: >-
    The Pool of Mnemosyne, Arkadia (post-game). Suggested: it surfaces from the
    pool as a golden drop once you have seen all 151 other Aethos species
    (static, level 70, one only).
