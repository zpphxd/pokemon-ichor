line: narcissus
species:

- dex: 91
  concept: Spring bulb
  name: Narcibulb
  etymology: narkissos (Greek, the narcissus flower) + bulb
  category: Spring Bulb
  types: [Grass]
  abilities: [Oblivious]
  hidden_ability: Mirror Armor
  base_stats: {hp: 50, atk: 38, def: 55, spa: 60, spd: 62, spe: 40}
  ev_yield: {spd: 1}
  exp_yield: 60
  catch_rate: 190
  gender: {female_pct: 12.5}
  egg_groups: [Grass, Water 1]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.3
  weight_kg: 2.5
  myth: >-
    Narcissus scorned everyone who loved him, the nymph Echo among them, so
    Nemesis made him fall in love with his own reflection in a spring (Ovid,
    Metamorphoses 3).
  expression: >-
    A bulb already turned toward the water. Its sleepy eyes never meet anyone
    else's.
  art: >-
    Small: it fills about 24×30 px. A plump white bulb in three-quarter view
    facing left, with a tuft of papery skin on top and one green shoot. Two
    sleepy, half-shut eyes look down and away, never at the viewer. Marble-white
    bulb, limestone papery skin, olive shoot, black-figure ink outline. The
    follower walks with its eyes on the ground.
  shiny: The bulb turns a pale sun-gold.
  dex_entry:
    - It buries itself at the edge of a spring.
    - Even as a bulb it turns to face the
    - water, never the soft voice in the caves
    - that keeps calling back to it.
  habitat: >-
    Common by day in the grass around the Spring of Kallirhoe, Kythera. Echolali
    can often be heard from the sea caves below.
  learnset:
    level_up:
      - [1, Absorb]
      - [1, Sweet Scent]
      - [4, Growth]
      - [8, Stun Spore]
      - [12, Mega Drain]
      - [16, Magical Leaf]
      - [20, Ingrain]
      - [24, Reflect]
      - [28, Giga Drain]
      - [32, Amnesia]
      - [36, Petal Dance]
      - [40, Mirror Coat]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sunny Day, Rain Dance,
      Solar Beam, Energy Ball, Giga Drain, Bullet Seed, Seed Bomb, Magical Leaf, Grass Knot,
      Grassy Terrain, Grass Pledge, Leaf Storm, Worry Seed, Reflect, Light Screen, Safeguard,
      Natural Gift, Captivate, Charm, Weather Ball, Trailblaze, Water Pulse]
    egg: [Leech Seed, Synthesis, Aromatherapy, Yawn, Grass Whistle, Water Sport]
  signature: >-
    Oblivious: Attract, Captivate and Taunt don't reach it, because it isn't
    listening. It learns Reflect and Mirror Coat by level-up.
  new_move: null

