  myth: >-
    Odysseus raised the hound Argos before he sailed for Troy. Twenty years
    later Argos lay old and neglected by the palace gate, yet he knew his master
    through the beggar's disguise, wagged his tail and dropped his ears; and
    having seen him again, he died (Odyssey 17.290–327).
  expression: >-
    The dog who waited. It isn't strong for a post-game Pokémon, but it never
    leaves and never forgets, and it is fiercest against whoever walks through
    the door. Its Greek name meant swift, and the shiny remembers its other
    meaning, shining white.
  art: >-
    Medium: it fills about 46×36 px. An old, lean hound lying on a doorstep in
    three-quarter view facing left, its head lifted toward the viewer, ears
    dropped back and the tip of its tail caught mid-wag. A gray muzzle, ribs
    just showing under a rough coat, and calm, cloudy eyes. Limestone-tan coat
    with a marble-gray muzzle and brows, a worn terracotta collar, a sun-gold
    glint in the eyes, black-figure ink outline. The follower walks slowly at
    your heel and lies down whenever you stop.
  shiny: The coat turns shining silver-white and the eyes turn sun-gold.
  dex_entry:
    - It will wait twenty years at a door for
    - one who sailed away. It knows them in
    - any disguise. When they come home, it
    - wags its tail once, and at last it rests.
  habitat: >-
    Elaia, at the homecoming that ends the post-game Odyssey. An old hound is
    lying at your own front door when you get back; it lifts its head, knows
    you, and joins you (a gift, one only). It isn't found in the wild.
