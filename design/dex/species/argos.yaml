  myth: >-
    Odysseus raised the hound Argos before he sailed for Troy. Twenty years
    later Argos lay old and neglected by the palace gate, yet he knew his master
    through the beggar's disguise, wagged his tail and dropped his ears; and
    having seen him again, he died (Odyssey 17.290–327).
  expression: >-
    The dog who waited, as it ran when it was young. Its Greek name means both
    swift and shining white, and it is both: a white hound at full gallop whose
    wag throws a gold comet. It isn't strong for a post-game Pokémon, but it
    never leaves and never forgets, and it is fiercest against whoever walks
    through the door.
  art: >-
    Large: it fills about 62×58 px. A lean white sighthound in a flying gallop
    in three-quarter view facing left, legs stretched fore and aft and long ears
    streaming back like pennants. Its muzzle has grayed with the long wait, its
    eye is sun-gold, and it wears a worn terracotta collar with a black-figure
    key. Its tail is raised mid-wag and throws a comet arc of sun-gold light
    over its back that breaks into a running-dog wave scroll. Marble-white coat
    with Aegean-blue shadows, a gray muzzle, terracotta collar, sun-gold comet
    and eye, black-figure ink outline. Frame 2 gathers its legs under it
    mid-stride; the back sprite shows the comet rising from its tail, and the
    follower walks at your heel and lies down whenever you stop.
  shiny: The Aegean-blue shadows in its coat turn silver-gray, so it shines pure silver-white.
  dex_entry:
    - It will wait twenty years at a door for
    - one who sailed away. It knows them in
    - any disguise. When they come home, it
    - wags its tail once, and at last it rests.
  habitat: >-
    Elaia, at the homecoming that ends the post-game Odyssey. An old hound is
    lying at your own front door when you get back; it lifts its head, knows
    you, and joins you (a gift, one only). It isn't found in the wild.
