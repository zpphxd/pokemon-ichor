    Return, the homecoming, is its signature: it starts at the highest base
    friendship in the dex, so Return hits full power almost at once. Stakeout
    punishes whoever comes through the door, Mind's Eye sees through disguises
    and Ghosts alike, and Healing Wish is its last gift.
