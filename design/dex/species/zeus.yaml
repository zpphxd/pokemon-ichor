  myth: >-
    When Kronos fell, his three sons drew lots for the world: Zeus won the
    broad sky, Poseidon the gray sea and Hades the murky dark (Iliad
    15.187–193). Phidias's Zeus at Olympia sat enthroned in gold and ivory,
    an olive wreath on its head and an eagle on its scepter (Pausanias 5.11.1),
    so tall that if it stood up it would lift the temple roof (Strabo 8.3.30).
  expression: >-
    The statue that stood up and became the storm. It wears the Corinthian helm
    and cuirass the Cyclopes forged for all three brothers, and inside them it
    is a thunderhead, its forearm the thunderbolt itself. Like its brothers it
    has no face, only its lot's emblem glowing in the visor.
  art: >-
    Largest: it fills the whole box, about 62×61 px. A storm titan floating in
    three-quarter view facing left: a gold Corinthian helm and muscled cuirass,
    the war-gear all three brothers share, over a body of thunderhead that
    tapers below the belt into a storm funnel. A crest of living lightning arcs
    over the helm, a thunderbolt glows in the visor's T, and two great eagle
    wings of storm cloud spread behind it. Its near forearm is a forking bolt
    that strikes the ground, and its far hand is a gold-gauntleted fist.
    Sun-gold helm and cuirass with a black-figure meander belt, ink and
    storm-blue cloud, electric-yellow lightning, black-figure ink outline. Frame
    2 re-forks the bolt and flickers the crest; the back sprite shows the helm
    and crest between the wings, and the follower trails a few sparks.
  shiny: The gold helm and cuirass turn pale silver, and its lightning flashes Aegean blue.
  dex_entry:
    - It sat on a throne of gold and ivory.
    - Guides swore it would lift the temple roof
    - if it ever stood. The throne is empty now,
    - and thunder rolls wherever it goes.
  habitat: >-
    Olympus, on a storm-struck terrace below the true summit (post-game;
    suggested). Its empty throne in the Temple of Zeus at Olympia is the first
    clue. The terrace stays sealed until you hold the thunderbolt lot, which
    Kronolith gives back at the Omphalos in Delphoi; then the colossus waits
    there, day or night (static, level 70, one only).
