  myth: >-
    When Kronos fell, his three sons drew lots for the world: Zeus won the
    broad sky, Poseidon the gray sea and Hades the murky dark (Iliad
    15.187–193). Phidias's Zeus at Olympia sat enthroned in gold and ivory,
    an olive wreath on its head and an eagle on its scepter (Pausanias 5.11.1),
    so tall that if it stood up it would lift the temple roof (Strabo 8.3.30).
  expression: >-
    The statue that stood up. It has risen from Phidias's throne with a
    thunderbolt where the Victory used to sit in its hand, and like its two
    brothers it has no face, only its lot's emblem glowing where one should be.
  art: >-
    Largest: it fills the whole 64×64 box, its wreathed head pressing the top
    edge as if it could lift a roof. A colossal statue in three-quarter view
    facing left, half risen from the throne behind it, with ivory limbs and
    chest and a sun-gold robe falling from one shoulder to its feet. Its right
    hand raises a jagged gold thunderbolt and its left grips a tall scepter
    topped by a gold eagle with spread wings. Where its face should be is a
    smooth ivory oval with a thunderbolt picked out in seven glowing points,
    under an olive wreath. Marble-white ivory shaded with limestone, sun-gold
    robe and fittings, olive wreath, an electric-yellow glow on the bolt and the
    face points, black-figure ink outline; the back sprite shows the robe and
    the empty throne, and the follower trails a few sparks.
  shiny: The ivory darkens to storm-gray and the gold turns pale silver, with an Aegean-blue glow on the bolt.
  dex_entry:
    - It sat on a throne of gold and ivory.
    - Guides swore it would lift the temple roof
    - if it ever stood. The throne is empty now,
    - and thunder rolls wherever it walks.
  habitat: >-
    Olympus, on a storm-struck terrace below the true summit (post-game;
    suggested). Its empty throne in the Temple of Zeus at Olympia is the first
    clue. The terrace stays sealed until you hold the thunderbolt lot, which
    Kronolith gives back at the Omphalos in Delphoi; then the colossus waits
    there, day or night (static, level 70, one only).
