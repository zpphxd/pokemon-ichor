  signature: >-
    The bolt that never misses. Lock-On at 42 sets up Zap Cannon at 48, the
    way the old Regis do it, and Rain Dance at 54 makes Thunder sure too.
    Lightning Rod pulls every Electric move to it and feeds its huge Special
    Attack, and Clear Body, shared by all three colossi, means nothing can
    lower its stats.
