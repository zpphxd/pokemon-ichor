  height_m: 2.3
  weight_kg: 210.0
  myth: >-
    Herakles cut his club from a wild olive. When he leaned it against a statue
    of Hermes at Troizen, it took root and grew into a tree again (Pausanias
    2.31.10).
  expression: >-
    A gnarled ancient trunk whose branch-arms are as heavy as Herakles's club.
    Break one off and it grows back.
  art: >-
    Large: it fills about 56×60 px. A massive, gnarled olive trunk in
    three-quarter view facing left, twisted and hollowed with age, standing on
    thick spreading roots. Two great branch-arms end in knotted club-heads, one
    raised over its shoulder ready to swing, and a stern face looks out from
    the bark under a wide silver-green canopy ringed with a wild-olive wreath.
    Gray-brown limestone bark with cypress-dark hollows, olive and silver-leaf
    canopy, black olives, a sun-gold glint in its eyes, black-figure ink
    outline. The follower thumps along, dragging its roots.
  shiny: A sun-gold canopy and pale marble bark, like a tree in a temple painting.
  dex_entry:
    - Its arms are as heavy as a hero's club.
    - Break one off and it grows back by dawn.
    - Wreaths cut from its branches crowned
    - the first winners at the Games.
  habitat: >-
