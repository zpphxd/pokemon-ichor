line: olive
species:

- dex: 18
  concept: Olive cutting
  name: Elaleaf
  etymology: elaia (Greek, olive) + leaf
  category: Olive Sprig
  types: [Grass]
  abilities: [Harvest, Leaf Guard]
  hidden_ability: Regenerator
  base_stats: {hp: 52, atk: 56, def: 58, spa: 40, spd: 50, spe: 34}
  ev_yield: {def: 1}
  exp_yield: 58
  catch_rate: 190
  gender: {female_pct: 50}
  egg_groups: [Grass]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.3
  weight_kg: 3.5
  myth: >-
    Athena won Athens from Poseidon by planting the first olive on the
    Akropolis (Apollodorus, Library 3.14.1). Olives grow from cuttings, so
    every olive tree is a piece of an older one.
  expression: >-
    An olive cutting that pulled itself up and walked off. It has two leaves
    and no intention of growing slowly.
  art: >-
    Small: it fills about 24×32 px. A short olive twig standing on a tuft of
    roots like little feet, in three-quarter view facing left. Two silver-green
    leaves sprout from the top like ears, one green olive hangs at its side, and
    a tiny face sits in the bark under the leaves. Gray-brown limestone bark,
    olive and silver-leaf leaves, an olive-green fruit, black-figure ink
    outline. The follower waddles with its leaves twitching.
  shiny: Sun-gold leaves and a black olive.
  dex_entry:
    - Plant a twig cut from it and a new one
    - stands up the next day. Every one in
    - Elaia is said to come from a cutting of
    - Athena's first tree.
  habitat: >-
    Elaia's olive groves and the Akademia grove, in tall grass by day; common.
    It may become the Pokémon Professor Daphne shows in her intro.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Absorb]
      - [4, Growth]
      - [7, Leafage]
      - [10, Mega Drain]
      - [13, Leech Seed]
      - [16, Bullet Seed]
      - [20, Worry Seed]
      - [24, Seed Bomb]
      - [28, Strength Sap]
      - [32, Giga Drain]
      - [36, Wood Hammer]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Sunny Day, Grassy Terrain,
      Safeguard, Bullet Seed, Seed Bomb, Magical Leaf, Energy Ball, Giga Drain, Grass Knot,
      Solar Beam, Trailblaze, Worry Seed, Synthesis, Grassy Glide, Leaf Storm, Pollen Puff,
      Rock Smash, Strength, Mud-Slap, Helping Hand, Reversal, Endeavor, Take Down]
    egg: [Synthesis, Grassy Glide, Curse, Counter, Ingrain]
  signature: >-
    Leech Seed and Strength Sap give it the olive's knack for recovering, and
    Regenerator lets every stage regrow what it loses.
  new_move: null

- dex: 19
  concept: Olive sapling
  name: Elapling
  etymology: elaia (Greek, olive) + sapling
  category: Sapling
  types: [Grass]
  abilities: [Harvest, Leaf Guard]
  hidden_ability: Regenerator
