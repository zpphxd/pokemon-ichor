  ev_yield: {def: 2}
  exp_yield: 135
  catch_rate: 120
  gender: {female_pct: 50}
  egg_groups: [Grass]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 1.0
  weight_kg: 32.0
  myth: >-
    When the Persians burned the Akropolis, Athena's sacred olive burned with
    it. The next day the Athenians found a new shoot a cubit long growing from
    the stump (Herodotus 8.55).
  expression: >-
    A sapling that has already survived one fire. A bright new shoot grows from
    a scorched scar on its trunk.
  art: >-
    Medium: it fills about 38×48 px. A young olive tree walking on root-feet in
    three-quarter view facing left, its trunk slightly twisted and its two
    branch-arms raised in a boxer's guard. A blackened scar on its side has a
    fresh green shoot growing out of it, and a small silver-green canopy with a
    few olives sits on top. Limestone-gray bark with a black-figure ink scorch,
    olive and silver-leaf foliage, black-figure ink outline. The back sprite
    shows the scorch on its side.
  shiny: Sun-gold foliage over pale marble bark.
  dex_entry:
    - Burn it to the root and it sprouts again
    - by morning. It raises its branches like
    - fists whenever it hears a fight, and it
    - hears a lot of them.
  habitat: >-
    Evolves from Elaleaf at level 17. Rare in the wild, in Elaia's oldest olive
    groves.
