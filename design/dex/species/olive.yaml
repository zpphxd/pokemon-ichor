      - [13, Leech Seed]
      - [16, Bullet Seed]
      - [20, Worry Seed]
      - [22, Rock Smash]
      - [25, Seed Bomb]
      - [29, Strength Sap]
      - [33, Giga Drain]
      - [37, Bulk Up]
      - [41, Wood Hammer]
      - [45, Grassy Terrain]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Sunny Day, Grassy Terrain,
      Safeguard, Bullet Seed, Seed Bomb, Magical Leaf, Energy Ball, Giga Drain, Grass Knot,
      Solar Beam, Trailblaze, Worry Seed, Synthesis, Grassy Glide, Leaf Storm, Pollen Puff,
      Rock Smash, Strength, Mud-Slap, Helping Hand, Reversal, Endeavor, Take Down, Bulk Up,
