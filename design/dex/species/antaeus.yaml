  myth: >-
    Antaeus, a giant son of Gaia, made every traveler wrestle him. Each fall to
    the ground only renewed his strength, so Herakles lifted him off the earth
    and crushed him in the air (Apollodorus 2.5.11; Pindar, Isthmian 4).
  expression: >-
    A giant wrestler that never lifts its heels: its toes are roots sunk in
    the sand. Throw it down and it gets up stronger. Lift it, and it is
    helpless.
  art: >-
    Large: it fills about 56×58 px. A huge, broad-shouldered wrestler in
    three-quarter view facing left, in a low grappling crouch with arms wide
    and hands open. Its feet are flat and spread, and the toes are thick roots
    dug into a patch of sand. Clay-red skin streaked with dust and oil like a
    palaestra wrestler, a topknot of dry grass, and cracked-earth patterns on
    its forearms. Terracotta skin, limestone sand and dust, olive root-toes,
    black-figure ink outline. The follower shuffles flat-footed and never hops.
  shiny: Marble-pale skin with cypress-green roots, like a statue of a wrestler.
  dex_entry:
    - Its toes are roots. Each time it is
    - thrown to the ground, it springs up
    - stronger than before, so wise rivals
    - try to lift it off its feet instead.
  habitat: >-
    The wrestling sands of the Lakonian palaestra, by day; rare, and only one
    at a time. More appear on the sands of Olympia in the post-game.
