- dex: 151
  concept: Dark colossus
  name: Nekranax
  etymology: nekros (Greek, the dead) + anax (Greek, lord, king); Homer calls Hades the lord of those below (Iliad 20.61)
  category: Shade Lord
  types: [Ghost]
  abilities: [Clear Body]
  hidden_ability: Perish Body
  base_stats: {hp: 100, atk: 100, def: 200, spa: 60, spd: 90, spe: 50}
  ev_yield: {def: 3}
  exp_yield: 300
  catch_rate: 3
  gender: {genderless: true}
  egg_groups: [Undiscovered]
  egg_cycles: 120
  growth_rate: Slow
  base_friendship: 35
  height_m: 4.1
  weight_kg: 905.0
  myth: >-
    In the drawing of lots Hades won the murky dark (Iliad 15.187–193), and his
    name was heard as Aides, the Unseen (Plato, Cratylus 403a). His cap, the
    Helm of Hades, hides whoever wears it: Athena put it on so Ares could not
    see her (Iliad 5.844–845), and Perseus wore it to escape the Gorgons
    (Apollodorus, Library 2.4.2–3).
  expression: >-
    The brother of the dark, with a body of shadow. It wears the Corinthian helm
    and cuirass the Cyclopes forged for all three brothers, and its gauntlets
    end in the bident later artists gave Hades. When it puts the helm on it is
    simply gone, and under the helm, where a face should be, its lot's bident
    glows.
  art: >-
    Largest: it fills the whole box, about 60×62 px. A hulking shadow titan in
    three-quarter view facing left, sagging low: a black war-shell of helm,
    cuirass and great domed pauldrons, with shadow pouring up out of the helm
    like a crest of violet plumes and a bident glowing in the visor's T. Its
    arms end in giant gauntlets whose fingers are twin gold bident talons, and
    below its terracotta meander belt the body dissolves into tongues of shadow.
    Ink and dusk-violet armor with sun-gold bands, violet under-light, smoke
    wisps and sparks, black-figure ink outline. Frame 2 sways the shadow crest
    and dims the visor; the back sprite shows the plume and a raised talon over
    the shell, and the follower flickers out to a faint outline every few steps.
  shiny: Its black armor turns marble-white like a grave stele, and its violet glow turns sun-gold.
  dex_entry:
    - No one living has seen its face. It puts
    - on its helm and is gone, but the cold
    - stays, and the lamps go out one by one.
    - In the dark below, it waits for us all.
  habitat: >-
    The Underworld, in a vault beneath Hades's hall at the end of the Katabasis
    (post-game; suggested). The vault stays sealed until you hold the bident
    lot, which Kronolith gives back at the Omphalos in Delphoi. It shows itself
    only once every lamp in the vault has gone out (static, level 70, one only).
  learnset:
