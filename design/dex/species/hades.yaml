    egg: []
  signature: >-
    The Unseen. Phantom Force at 48 is the helm: it vanishes for a turn and
    strikes through Protect. Mean Look keeps foes from leaving, Iron Defense and
    Body Press turn its huge Defense into damage, and Perish Body dooms anything
    that lays a hand on it.
  new_move: null
