  egg_groups: [Flying]
  egg_cycles: 15
  growth_rate: Medium Slow
  height_m: 1.3
  weight_kg: 24.0
  myth: >-
    The birds build Nephelokokkygia, Cloudcuckooland, a walled city in the sky
    that blocks the smoke of mortals' offerings until the gods give in. The
    play ends with a new king of the birds holding Zeus's thunderbolt and
    marrying Basileia, Sovereignty herself (Aristophanes, Birds 1706–1765).
  expression: >-
    The self-made king. Its crest has become a crown, and it nests in a hall
    woven from cloud, where it keeps the offerings it intercepts.
  art: >-
    Large: it fills about 52×56 px. A tall, regal hoopoe standing upright in
    three-quarter view facing left, its wings folded over its shoulders like a
    cloak. Its crest is a full crown of fanned feathers, each tipped black, and
    it stands on a small nest of woven cloud. Terracotta-salmon breast, marble
    and black-figure ink barred wings, a sun-gold crown, a marble cloud nest,
    black-figure ink outline. The follower drifts a little way on its cloud
    between steps.
  shiny: The breast pales to marble and the crown turns Aegean blue.
  dex_entry:
    - It weaves its nest out of cloud, high on
    - the cliffs, and calls itself king. The
    - smoke of altars drifts up into it, and
    - it is said the gods go hungry.
