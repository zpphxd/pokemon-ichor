  egg_groups: [Flying]
  egg_cycles: 15
  growth_rate: Medium Slow
  height_m: 0.2
  weight_kg: 1.2
  myth: >-
    When Tereus was changed into a bird, Ovid gave him a crest on his head and
    a long beak like a spear: the hoopoe, epops in Greek (Metamorphoses
    6.671–674).
  expression: >-
    A fluffy chick whose crest is still a tiny tuft. It already calls its own
    name from every branch, the hoopoe's cry from the play.
  art: >-
    Tiny: it fills about 28×30 px. A round chick hopping in three-quarter view
    facing left, with a long, slightly curved beak too big for it. A small fan
    crest of three black-tipped feathers sticks straight up, and its stubby
    wings are barred black and white. Pale terracotta body with a limestone
    belly, marble and black-figure ink wing bars, black-figure ink outline. The
    follower pops its tiny crest up whenever it calls.
  shiny: The body turns sun-gold and the wing bars Aegean blue.
  dex_entry:
    - All day it calls out its own name from
    - the olive branches. Epopoi, popoi! When
    - startled, its tiny crest pops up.
  habitat: >-
    Route 1 and the olive groves around Elaia Village, in tall grass and under
    the trees by day. Very common.
