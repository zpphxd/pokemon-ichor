      - [16, Rock Smash]
      - [19, Dig]
      - [22, Brick Break]
      - [25, Lunge]
      - [28, Iron Defense]
      - [31, X-Scissor]
      - [35, Crunch]
      - [39, Bulk Up]
      - [43, Reversal]
      - [47, Close Combat]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Sunny Day, Sandstorm, Dig,
      Rock Smash, Strength, Rock Tomb, Bulldoze, Mud-Slap, X-Scissor, Bug Bite, Struggle Bug,
      Pounce, Skitter Smack, Leech Life, Iron Defense, Metal Claw, Helping Hand, Endeavor, Thief,
      Taunt, Retaliate, Work Up, Take Down, Poison Jab, Crunch, Brick Break, Bulk Up, Swords Dance,
