- dex: 81
  concept: Furnace calf
  name: Kaminoo
  etymology: kaminos (Greek, furnace or kiln) + moo
  category: Furnace Calf
  types: [Fire]
  abilities: [Flash Fire, Flame Body]
  hidden_ability: Anger Point
  base_stats: {hp: 55, atk: 62, def: 55, spa: 40, spd: 45, spe: 50}
  ev_yield: {atk: 1}
  exp_yield: 62
  catch_rate: 190
  gender: {female_pct: 0}
  egg_groups: [Field, Mineral]
  egg_cycles: 20
  growth_rate: Slow
  height_m: 0.9
  weight_kg: 64.0
  myth: >-
    Hephaestus made King Aeetes a pair of bronze-hoofed bulls that breathed
    fire. Jason had to yoke them and plow a field, protected by Medea's
    ointment (Apollonius, Argonautica 3).
  expression: >-
    Not bronze yet: a calf with a furnace just catching in its belly and a nose
    ring that's waiting for a yoke.
  art: >-
    Small: it fills about 36×32 px. A stocky calf in three-quarter view facing
    left, head lowered and front hooves planted. A big ring through its nose
    glows orange, a puff of smoke rises from its nostrils, and it has nub horns
    and a tufted tail with an ember tip. Terracotta hide with a darker saddle,
    a pale limestone muzzle, a sun-gold nose ring, black-figure ink outline. The
    follower snorts little sparks as it walks.
  shiny: Its hide turns black-figure dark and its nose ring glows blue-white.
  dex_entry:
    - Its nose ring glows like a coal. When it
    - is cross, it snorts sparks, so the herders
    - of Kaldera keep it well away from hay.
  habitat: >-
    Common by day on the forge slopes of Kaldera, in herds grazing the warm
    grass beside the lava vents.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Leer]
      - [4, Ember]
      - [8, Flame Charge]
      - [12, Work Up]
      - [16, Fire Fang]
      - [20, Stomp]
      - [24, Scary Face]
      - [28, Take Down]
      - [32, Double-Edge]
      - [36, Heat Crash]
      - [40, Flare Blitz]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sunny Day,
      Flamethrower, Fire Blast, Overheat, Will-O-Wisp, Fire Spin, Flame Charge, Fire Fang,
      Heat Crash, Flare Blitz, Temper Flare, Incinerate, Body Slam, Take Down, Double-Edge,
      Headbutt, Stomping Tantrum, Bulldoze, Dig, Rock Smash, Rock Tomb, Iron Tail, Iron Head,
      Wild Charge, Scary Face, Endeavor, Work Up, Bulk Up, Smart Strike, Thunder Fang]
    egg: [Curse, Smokescreen, Thrash, Double Kick, Flame Wheel, High Horsepower]
  signature: >-
    Flash Fire and Flame Body from birth, and Anger Point as its hidden ability:
    the calf that won't be yoked. Fire Fang and Stomp hit early.
  new_move: null

