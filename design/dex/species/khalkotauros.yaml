  myth: >-
    The Khalkotauroi, bulls of bronze made by Hephaestus, breathed fire from
    their nostrils. Jason, anointed with Medea's charm against flame, forced
    them under the yoke and plowed the field of Ares (Apollonius, Argonautica 3).
  expression: >-
    The full Khalkotauros: riveted bronze over a roaring furnace. The calf's
    nose ring has become the ring the yoke hooks onto.
  art: >-
    Large: it fills about 60×50 px. A massive bull in three-quarter view facing
    left, mid-charge with its head down and horns forward. Riveted bronze plates
    cover its shoulders and flanks, a furnace grate in its chest shows fire,
    flame jets from its nostrils, and its hooves are solid bronze. The calf's
    nose ring survives, heavy and glowing. Sun-gold and terracotta bronze, marble
    highlights on the rivets, one hot orange accent for the furnace, black-figure
    ink outline. The back sprite shows a riveted spine.
  shiny: The bronze darkens to black iron and the furnace glows blue-white.
  dex_entry:
    - A furnace roars inside its riveted bronze
    - chest, and its breath can melt a plow. It
    - is said the only one who ever yoked it
    - wore a balm that fire could not touch.
  habitat: >-
