  gender: {genderless: true}
  egg_groups: [Mineral]
  egg_cycles: 25
  growth_rate: Medium Slow
  height_m: 0.4
  weight_kg: 36.0
  myth: >-
    Hephaestus forged Talos, a man of bronze, and gave him to King Minos to
    guard Crete. He ran around the island three times a day and stoned any
    ship that came near (Apollodorus, Library 1.9; Apollonius, Argonautica 4).
  expression: >-
    A votive bronze figure from the forge, small enough to stand on a shelf,
    that has taken the guard's job to heart. A thin gold line already runs
    from its neck to one ankle.
  art: >-
    Small: it fills about 30×38 px. A stiff little bronze warrior figurine in
    three-quarter view facing left, standing on a square base with one arm
    raised as if to throw a pebble. A blocky archaic body, a simple helmeted
    head with two round glowing eyes, and a thin gold line from its neck down
    to one ankle. Sun-gold and terracotta bronze with ink-brown shading, a
    bright sun-gold vein, black-figure ink outline. The follower marches in a
    tight circle whenever the player stands still.
  shiny: Its bronze turns to a cypress-green patina, with a marble-white vein.
  dex_entry:
    - Cast as an offering at the forge, it took
    - its job to heart. It walks laps around
    - anything it is told to guard, three
    - times a day.
  habitat: >-
    Kaldera's forge on Thera Isle, among the cooling molds and scrap heaps, by
    day and night. Uncommon.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Harden]
      - [4, Metal Claw]
      - [8, Rock Throw]
      - [12, Mud-Slap]
      - [16, Iron Defense]
      - [20, Rock Tomb]
      - [24, Headbutt]
      - [28, Iron Head]
      - [32, Stealth Rock]
      - [36, Heavy Slam]
      - [40, Rock Slide]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Snore, Toxic, Sandstorm, Sunny Day,
      Rock Tomb, Rock Slide, Rock Blast, Smack Down, Stealth Rock, Stone Edge, Iron Head, Iron Defense,
      Heavy Slam, Gyro Ball, Flash Cannon, Steel Beam, Metal Claw, Bulldoze, Mud-Slap, Dig, Rollout,
      Self-Destruct, Explosion, Body Press, Block, Headbutt, Strength, Rock Smash, Fling]
    egg: [Rapid Spin, Curse, Counter, Wide Guard, Bide, Magnitude]
  signature: >-
    Heavy Metal doubles its weight, so Heavy Slam hits hard even at this size.
    Clear Body means nothing can lower its guard.
  new_move: null

