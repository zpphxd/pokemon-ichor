  egg_groups: [Flying, Field]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.3
  weight_kg: 2.5
  myth: >-
    Ares set the youth Alectryon to keep watch while he was with Aphrodite.
    Alectryon fell asleep, the sun god Helios saw them, and Ares turned the
    boy into a rooster (Lucian, The Dream, or the Cock 3).
  expression: >-
    A chick that wakes before anyone else and peeps at the dark, already
    practicing the warning it was born to give.
  art: >-
    Small: it fills about 30×30 px. A round, fluffy chick standing up on its
    toes in three-quarter view facing left, chest puffed, stubby wings held
    out like little fists, a tiny comb nub on its head and two spur bumps on
    its legs. Its eyes are wide awake. Sun-gold and limestone down, terracotta
    comb, beak and feet, black-figure ink outline. The follower hops and pecks
    at the ground.
  shiny: Its down turns marble white and its comb Aegean blue.
  dex_entry:
    - It wakes long before dawn and peeps at
    - the dark sky, as if afraid it will miss
    - the sun. It cannot bear to be late.
  habitat: >-
    Elaia's farmyards on Kalliste Isle, early mornings only; common around
    the olive presses and threshing floors.
