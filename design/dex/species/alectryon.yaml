      Low Sweep, Rock Smash, Aerial Ace, Pluck, Sunny Day, Uproar, Endeavor, Reversal, Counter,
      Detect, Helping Hand, Taunt, Thief, Agility, Mud-Slap, Work Up, Echoed Voice, Coaching,
      Steel Wing, Double-Edge, Blaze Kick]
    egg: [Quick Guard, Mirror Move, Feint, Vacuum Wave, Triple Kick, Revenge, Feather Dance]
