  signature: >-
    Unaware ignores every stat boost a foe brags about, Slack Off keeps it
    lazing in its jar, and Foul Play turns the foe's own strength on it. Its
    Trick Room makes being slow the point. It never learns Helping Hand.
  new_move: null
