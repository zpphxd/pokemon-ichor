line: pomegranate
species:

- dex: 52
  concept: Pomegranate seed
  name: Rhoaril
  etymology: rhoa (Greek, pomegranate) + aril, the juicy coat of its seed
  category: Pomegranate
  types: [Grass]
  abilities: [Ripen, Leaf Guard]
  hidden_ability: Harvest
  base_stats: {hp: 50, atk: 45, def: 55, spa: 55, spd: 55, spe: 40}
  ev_yield: {spa: 1}
  exp_yield: 62
  catch_rate: 120
  gender: {female_pct: 100}
  egg_groups: [Grass, Fairy]
  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 0.3
  weight_kg: 1.8
  myth: >-
    Hades seized Kore as she picked a narcissus and carried her below. Before
    she was returned she ate a pomegranate seed, and so she must spend part of
    every year in the underworld as its queen (Homeric Hymn to Demeter).
  expression: >-
    A single glistening seed, split from its fruit and never sure where it
    belongs. It sleeps in the dark and leans toward the light at the same time.
  art: >-
    Small: it fills about 26×30 px. A plump, teardrop-shaped pomegranate seed
    in three-quarter view facing left, standing on two tiny root feet. Its
    glossy, translucent body shows a pale kernel inside like a heart. A crown
    of six small calyx points tops its head, like the fruit's, with one curled
    leaf sprouting from it. Big dark eyes, one bright and one half in shadow.
    Terracotta with a deep pomegranate-red accent and a marble highlight,
    olive leaf, cypress-dark calyx, black-figure ink outline. The follower
    glows faintly at night.
  shiny: Its red body turns pale sun-gold, like an unripe fruit.
  dex_entry:
    - It sleeps deep in the dark sanctum, but
    - its sprout always leans toward the sun.
    - No one knows which way it will grow.
  habitat: >-
    Uncommon. Found in the underground Mystery sanctum beneath Eleusa Village,
    day and night.
  learnset:
    level_up:
      - [1, Absorb]
      - [1, Sweet Scent]
      - [4, Leafage]
      - [7, Fairy Wind]
      - [10, Astonish]
      - [13, Mega Drain]
      - [16, Magical Leaf]
      - [19, Leech Seed]
      - [22, Worry Seed]
      - [25, Giga Drain]
      - [28, Natural Gift]
      - [31, Energy Ball]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Sunny Day,
      Grassy Terrain, Bullet Seed, Magical Leaf, Seed Bomb, Energy Ball, Giga Drain, Grass Knot,
      Solar Beam, Worry Seed, Nature Power, Trailblaze, Charm, Helping Hand, Safeguard, Light Screen,
      Swift, Pollen Puff, Weather Ball, Disarming Voice]
    egg: [Ingrain, Aromatherapy, Grass Whistle, Wish, Pain Split, Memento]
  signature: >-
    It branches at level 28: into Korantha if it levels up by day, or into
    Persenyx by night. Ripen doubles what its Berries do, since it is a fruit
    itself.
  new_move: null

- dex: 53
