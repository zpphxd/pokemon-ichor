      - [19, Leech Seed]
      - [22, Worry Seed]
      - [25, Giga Drain]
      - [28, Natural Gift]
      - [32, Dazzling Gleam]
      - [36, Energy Ball]
      - [40, Grassy Terrain]
      - [44, Synthesis]
      - [48, Moonblast]
      - [55, Leaf Storm]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
