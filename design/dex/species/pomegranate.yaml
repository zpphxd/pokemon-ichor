    three-quarter view facing left, standing very still, with a long veil of
    dark leaves falling from a crown of withered stems. In one cupped hand it
    holds a split pomegranate whose seeds glow in the dark. Its petal robe has
    faded to ash gray and frays into wisps at the hem, and its eyes are calm
    and unblinking. Cypress-dark leaves, marble-pale skin, an ash-gray robe,
    glowing pomegranate-red seeds, a ghostly violet accent, black-figure ink
    outline. The follower drifts without touching the ground.
