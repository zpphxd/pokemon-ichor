  egg_cycles: 20
  growth_rate: Medium Slow
  height_m: 1.5
  weight_kg: 36.0
  myth: >-
    Each spring Kore rises from the underworld to her mother Demeter, and the
    grieving earth bursts into flower and grain again. Her return was the
    heart of the Eleusinian Mysteries (Homeric Hymn to Demeter).
  expression: >-
    The maiden of spring as she was before the narcissus: flower-crowned and
    barefoot. Wherever it walks, the ground greens.
  art: >-
    Large: it fills about 46×58 px. A slender maiden-like figure in
    three-quarter view facing left, mid-step on bare root feet, one hand
    reaching for a white narcissus. A full crown of spring flowers blooms
    around a pomegranate blossom at the brow, and a long peplos of overlapping
    petals falls to the ground. A gentle, open face with a small seed-shaped
    mark on each cheek. Olive and silver-leaf greens, marble petals, a
    pomegranate-red blossom, a soft fairy-pink accent, black-figure ink
    outline. The follower leaves a short trail of flowers that fade behind it.
  shiny: Its petals turn sun-gold and its crown blossom white.
  dex_entry:
    - By day it walks the wheat fields, and
    - flowers open in its footsteps. When it
    - goes below, they say, winter comes.
  habitat: >-
    Evolves from Rhoaril at level 28 during the day. Rarely, one walks Eleusa
    Village's fields by day.
