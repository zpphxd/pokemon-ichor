species:

- dex: 127
  concept: Ice shard
  name: Pagoshard
  etymology: pagos (Greek, frost, and also a rocky crag) + shard
  category: Ice Shard
  types: [Ice]
  abilities: [Clear Body, Heatproof]
  hidden_ability: Solid Rock
  base_stats: {hp: 55, atk: 70, def: 90, spa: 40, spd: 45, spe: 30}
