  egg_cycles: 25
  growth_rate: Medium Fast
  height_m: 0.6
  weight_kg: 35.0
  myth: >-
    Krystallos is the Greek word for ice. Greek writers held that rock crystal
    was ice frozen so hard, high in the coldest mountains, that it could never
    thaw again (Pliny, Natural History 37.9, from Greek sources).
  expression: >-
    A splinter of ice with a quartz heart, already harder than ordinary ice and
    slow to melt even in the hand. It is halfway between frost and stone.
  art: >-
    Small: it fills about 30×36 px. A jagged, upright ice shard in
    three-quarter view facing left, standing on a stubby base like a crystal
    point growing from rock. A six-sided quartz core shows through inside, with
    two small square eyes set in its facets, and little frost crystals stud its
    sides. Pale Aegean blue and marble-white ice, darker Aegean-blue facet
    edges, a limestone-gray rock base, black-figure ink outline. The follower
    slides along the ground as if on ice.
  shiny: Smoky sun-gold quartz, like citrine.
  dex_entry:
    - It looks like a splinter of ice, but it
    - will not melt even in a fire. Miners in
    - the ice caves say it is ice that froze
    - so hard it forgot how to thaw.
  habitat: >-
    The ice caves of the Ascent, at any time; uncommon. It hides among real
    icicles on the cave walls.
  learnset:
    level_up:
      - [1, Tackle]
      - [1, Harden]
      - [4, Powder Snow]
      - [8, Rock Throw]
      - [12, Ice Shard]
      - [16, Rock Polish]
      - [20, Rock Tomb]
      - [24, Avalanche]
      - [28, Iron Defense]
      - [32, Rock Slide]
      - [36, Icicle Spear]
      - [40, Body Press]
      - [44, Stone Edge]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Icy Wind, Avalanche,
      Icicle Spear, Hail, Snowscape, Rock Tomb, Rock Slide, Rock Polish, Smack Down, Stone Edge,
      Stealth Rock, Sandstorm, Iron Defense, Body Press, Gyro Ball, Rollout, Self-Destruct, Bulldoze,
      Reflect, Light Screen, Take Down]
    egg: [Mirror Coat, Curse, Explosion, Block, Ice Ball, Rapid Spin]
  signature: >-
    Clear Body stops its stats being lowered and Heatproof halves Fire damage,
    so it is slow to melt. Body Press at 40 turns its Defense into damage.
  new_move: null

