  myth: >-
    Across the strait from Scylla, under a great fig tree, Charybdis swallows the
    black sea and spits it out three times a day. Odysseus survived her by
    clinging to the fig tree's branches as his raft went down (Odyssey 12.101–107,
    426–446). Later writers made her a daughter of Poseidon and Gaia (Servius, on
    Aeneid 3.420).
  expression: >-
    The other half of the strait. A sea-god's daughter with earth in her, it
    lives in a pit in the seabed and drinks the sea in three gulps a day. What
    flees its pull ends up in Hexylla's reach.
  art: >-
    Largest: it fills the whole 64×64 box. A sea-serpent rearing out of its own
    coils in three-quarter view facing left, its head turned to the viewer with
    the jaws thrown wide in a frilled threat display. The open throat is a round
    maw ringed with rows of marble fangs that spiral inward like a whirlpool
    toward a glowing magenta core, and a violet palmette frill fans out behind
    the head. A gnarled fig tree grows from the tip of its tail at the top
    right. Indigo and Aegean-blue scales with a limestone belly, marble fangs, a
    violet frill, a magenta glow, an olive fig, black-figure ink outline. Frame
    2 pulses the glow in its throat; the back sprite shows the frill and open
    jaws in profile, and the follower is a small spinning eddy that pulls loose
    leaves toward it.
  shiny: Its scales turn sun-gold and its belly marble white.
  dex_entry:
    - Three times a day it gulps down the sea
    - and spits it out again. Ships that flee
    - its pull to the far shore sail straight
    - into reach of Hexylla's six heads.
  habitat: >-
    The whirlpool on the Charybdis side of the strait, on the post-game Odyssey
    (rare). It surfaces three times a day, at morning, noon and evening; Surf
    into the eddy at those hours to meet one.
