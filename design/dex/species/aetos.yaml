      - [16, Aerial Ace]
      - [20, Hone Claws]
      - [24, Pluck]
      - [28, Agility]
      - [32, Drill Peck]
      - [36, Sky Drop]
      - [40, Roost]
      - [44, Brave Bird]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
