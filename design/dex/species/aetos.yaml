      Air Slash, Fly, Pluck, Roost, Tailwind, Defog, U-turn, Acrobatics, Brave Bird, Dual Wingbeat,
      Steel Wing, Sky Attack, Sky Drop, Agility, Swift, Double-Edge, Take Down, Hone Claws, Thief,
      Knock Off, Taunt, Rock Smash, Retaliate, Work Up, Whirlwind, Mud-Slap, Rain Dance, Sunny Day]
    egg: [Mirror Move, Feather Dance, Bulk Up, Crush Claw, Night Slash]
  signature: >-
    Sky Drop at 36 lifts a foe off the ground for a turn, the way Ganymede was
    carried off. Intimidate from the start; Motor Drive waits for the
    thunderbolt it will one day carry.
  new_move: null

