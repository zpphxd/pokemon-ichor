  gender: {female_pct: 50}
  egg_groups: [Flying]
  egg_cycles: 20
  growth_rate: Slow
  height_m: 0.6
  weight_kg: 6.5
  myth: >-
    Periphas was a king of Attica so just that his people honored him like
    Zeus. Zeus turned him into an eagle, made him king of the birds, and let
    him guard the scepter and carry the thunderbolts (Antoninus Liberalis 6).
  expression: >-
    A fierce, scruffy eaglet that already stares down grown birds. It was born
    to rule the sky, and it is waiting for a ruler just enough to serve.
  art: >-
    Small: it fills about 34×38 px. A fluffy eaglet in three-quarter view
    facing left, perched on a crag with its talons gripping hard, wings half
    spread and hackles up. An oversized hooked beak and a heavy brow give it a
    scowl, and two stray feathers stick up from its crown like a tiny crown.
    Marble-white down, limestone-tan flight feathers, a sun-gold beak, feet and
    crest, black-figure ink outline. The follower hops with its wings flared,
    trying to look bigger.
  shiny: Cypress-dark down with an Aegean-blue crest.
  dex_entry:
    - Even as a chick it stares down birds
    - twice its size. Shepherds on the Ascent
    - say it is looking for a king worth
    - serving, and has not found one yet.
  habitat: >-
    The nests on the crags of the Ascent, by day; rare, at level 38. It dives
    at anyone who climbs too near.
