  myth: >-
    Niobe boasted that her fourteen children outshone Leto's two, so Apollo and
    Artemis shot them all, and Niobe turned to stone on Mount Sipylos, where
    the rock still weeps (Iliad 24; Ovid, Metamorphoses 6). Pausanias climbed
    to see it: up close it is only a crag, and only from far off does it look
    like a woman in tears (Pausanias 1.21.3).
  expression: >-
    A cliff face that, from a distance, is a woman bowed in grief, with a
    spring running from her eyes. Up close it is only rock, and it won't let
    you see its face.
  art: >-
    Large: it fills about 54×60 px. A tall, hunched rock formation in
    three-quarter view facing left, shaped like a veiled woman bent forward
    with her head bowed into her hands. Two thin streams of water run from
    beneath the veil, down the rock and into a small pool at its base, and moss
    clings to the folds of its stone robe. Limestone and marble-gray rock, olive
    moss, Aegean-blue water, black-figure ink outline. The back sprite is plain
    cliff, with no face at all.
  shiny: Pale marble-white stone with sun-gold tears.
  dex_entry:
