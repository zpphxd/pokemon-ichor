  myth: >-
    Ladon was the serpent coiled around the tree of golden apples in the garden
    of the Hesperides, the apples Gaia gave Hera as a wedding gift. He had a
    hundred heads and spoke in many voices, and Herakles had to get past him for
    his eleventh Labor (Hesiod, Theogony 333–335; Apollodorus 2.5.11).
  expression: >-
    A guardian that has grown into the thing it guards: its coils are the
    tree's trunk, and the golden apples hang from its scales. In myth it is the
    Hydra's sibling, and Hera's Hierophant keeps both.
  art: >-
    Large: it fills about 62×61 px. A serpent grown into the tree it guards, in
    three-quarter view facing left: its gold coils root in a ring on the ground,
    its body twists up into a braided bark trunk, and its hood spreads into a
    round canopy of olive leaf-scales on gold ribs, hung with golden apples. Its
    serpent head rears from the top left of the canopy with a pink eye and a
    flicking tongue, and small hissing heads peer out among the leaves. Sun-gold
    scales with a terracotta belly, umber bark, olive and cypress leaves,
    sun-gold apples, a soft pink Fairy accent in the eyes, black-figure ink
    outline. Frame 2 lifts the head and flicks the tongue; the back sprite shows
    the canopy's ribbed hood from behind, and the follower slithers with one
    apple balanced on its head.
  shiny: The scales turn silver-white and the apples turn pale Aegean blue.
  dex_entry:
    - It coils around a tree of golden apples.
    - A hundred voices hiss from its scales at
    - once, so no thief can slip by unheard.
    - The apples it guards never run out.
  habitat: >-
    The garden of the Hesperides at the western edge of the world, reached in
    the post-game Labors (the eleventh). One guards the tree as a static
    encounter at dusk, and only one. Olympias, the Serpent Queen of the
    Pantheon, keeps another.
