  myth: >-
    When King Oeneus of Calydon left Artemis out of his harvest offerings, she
    sent a monstrous boar to ravage his fields. Meleager gathered the heroes of
    Greece to hunt it, and Atalanta drew its first blood (Homer, Iliad 9; Ovid,
    Metamorphoses 8).
  expression: >-
    The piglet, claimed by Artemis's woods and grown into her punishment. Its
    tusks curve into a crescent moon, and its bristles stand up like spears.
  art: >-
    Large: it fills about 62×52 px, low and massive. A huge bristled boar in
    three-quarter view facing left, head lowered to charge and one forehoof
    pawing the ground. Two great tusks curve up and inward until they almost
    meet in a crescent moon. A ridge of spear-like bristles runs from brow to
    tail, and its small eyes burn sun-gold. Cypress-dark and black-figure ink
    hide, limestone tusks with a marble highlight, a moon-silver accent on the
    crescent, sun-gold eyes, black-figure ink outline. The back sprite shows
    the bristle ridge raised like a row of spears.
  shiny: Its dark hide turns terracotta red and its tusks sun-gold.
  dex_entry:
    - Its tusks meet in a crescent moon. When
    - a village forgets its offerings, one of
    - these comes out of the woods at night.
  habitat: >-
    Evolves from Kaplet when it levels up in Arkadia. Rare in Arkadia's
