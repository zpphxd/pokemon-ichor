  myth: >-
    In Plato's Meno, Meno tells Socrates he is like the flat torpedo fish, the
    narke, which numbs anyone who touches it, because his questions leave
    people unable to answer. Socrates replies that he numbs others only
    because he is numb himself (Plato, Meno 80a-c).
  expression: >-
    The ray of Meno's simile, wearing the face it was compared to. A bald,
    bearded face on its back seems about to ask you something, and touching it
    leaves you numb and unsure of everything.
  art: >-
    Medium: it fills about 52×36 px, wide and flat. A round-winged torpedo ray
    in three-quarter view facing left, gliding with its fin tips curled up and
    a short, thick tail. The markings on its back form a bald, bearded,
    snub-nosed face with a furrowed brow, like a philosopher's bust. Two
    kidney-shaped electric organs glow under the skin on either side.
    Limestone-sand back, marble belly edge, Aegean-blue fin rims, a sun-gold
    glow, black-figure ink outline. The follower floats a hand's breadth off
    the ground and settles flat when it stops.
  shiny: Its sandy back turns Aegean blue and its glow white.
  dex_entry:
    - A bearded face on its back seems about
    - to ask a question. Touch it and you go
    - numb, unable to answer anything at all.
  habitat: >-
    Uncommon. Hooked with a Good Rod in Astyra's harbor and on the trireme
    crossings, day or night.
