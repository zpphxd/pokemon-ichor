    view facing left, sitting up on its haunches and looking up at the sky,
    one paw raised. Seven pale dots on its back trace the shape of the
    Great Bear. A crescent-shaped patch of pale fur on its chest. Black-figure
    ink and dark Aegean-blue fur, marble-white star spots and chest patch,
    one Fairy-pink nose, black-figure ink outline. The follower stops to look
    up whenever the sky is clear.
  shiny: Its fur turns deep cypress-green and the star spots sun-gold.
  dex_entry:
    - Seven pale spots on its back shine on
    - clear nights. When it is lost, it looks
    - up, finds the stars that match them,
    - and walks the way they point.
  habitat: >-
