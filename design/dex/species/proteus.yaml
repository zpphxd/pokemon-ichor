  myth: >-
    Proteus, the Old Man of the Sea, herds Poseidon's seals and naps among them
    at noon. Menelaus seized him there, and Proteus became a lion, a serpent, a
    leopard, a boar, running water and a tall tree; but Menelaus held on, and
    the old god had to tell him the truth (Odyssey 4.351–570).
  expression: >-
    The shape-shifter behind the word protean. Protean turns it into the type
    of the move it uses, and the moves it learns are the shapes it took in
    Menelaus's grip: lion, serpent, leopard, boar, water and tree.
  art: >-
    Medium: it fills about 46×44 px. A stout old sea-elder in three-quarter view
    facing left, half seal and half old man, propped on its flippers with a long
    beard of curling sea-foam that becomes a breaking wave at its tip. A heavy
    brow, one sly half-open eye, and faint outlines of a lion's mane, a scaly
    coil and a leaf pattern rippling across its hide as if it can't hold one
    shape. Aegean-blue and pale-blue hide, marble beard and foam, a
    limestone-tan belly, a sun-gold eye, black-figure ink outline. The follower
    naps whenever you stand still.
  shiny: The hide turns marble gray like an old seal's, and the beard sun-gold.
  dex_entry:
    - At noon it naps among the seals it herds.
    - Seize it and it turns to lion, serpent,
    - boar and water in turn. Hold on until it
    - tires, and it must tell you your future.
  habitat: >-
    The shallows of Atlantis and the islets of the Odyssey, only around noon,
    asleep among herds of seals (rare). It wakes and dives if you come at it
    from the front, so approach from behind.
