  myth: >-
    Hera cursed the nymph Echo to repeat only the last words she heard. Scorned
    by Narcissus, she pined in the caves until nothing was left of her but her
    voice (Ovid, Metamorphoses 3).
  expression: >-
    Half there, with a ripple where its mouth should be. Every move it learns
    is someone else's.
  art: >-
    Medium: it fills about 36×48 px. A slender nymph in three-quarter view
    facing left, drawn in so few pale colors that she seems only half there. A
    smooth face with large eyes and no mouth; where the mouth would be, three
    thin rings ripple outward. Her hair and dress trail off into more rings of
    sound. Only marble-white and the two lightest Aegean blues, with gaps of
    transparency through the body and a thin black-figure ink outline that
    breaks in places. The follower walks a step behind the player and copies
    its facing.
  shiny: Its pale blues turn a faint lilac, the color of dusk in the caves.
  dex_entry:
    - It has no mouth and can only repeat the
    - last words it hears. It lingers in the
    - caves below a certain spring, saying a
    - flower's words back to it, unheard.
  habitat: >-
    Rare, at any hour, in Kythera's sea caves where the Spring of Kallirhoe runs
    down to the sea. It is usually found near Narcisheen, and it is heard long
    before it's seen.
