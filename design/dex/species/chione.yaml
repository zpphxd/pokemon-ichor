      Dazzling Gleam, Swift, Fake Tears, Helping Hand, Tailwind, Psych Up]
    egg: [Wish, Sweet Kiss, Misty Terrain, Lucky Chant, Ice Shard, Moonlight]
  signature: >-
    Snow Cloak hides it in falling snow, and Haze at 16 wipes out a foe's stat
