    three-quarter view facing left, tilted slightly, with a round, sleepy face
    at its center and two little crystal arms reaching out. Each of the six
    arms branches into finer frost, and a few loose flakes trail behind it.
    Marble-white and pale Aegean blue with a darker Aegean-blue core, and a thin
    black-figure ink outline. The follower spins slowly as it floats.
