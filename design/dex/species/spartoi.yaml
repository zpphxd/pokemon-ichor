      - [1, Mud-Slap]
      - [1, Dragon Rage]
      - [13, Rock Tomb]
      - [17, Ingrain]
      - [21, Dragon Tail]
      - [25, Crunch]
      - [29, Iron Defense]
      - [33, Scale Shot]
      - [37, Dig]
      - [43, Brick Break]
      - [46, Dragon Rush]
      - [50, Bulk Up]
      - [54, Dragon Dance]
      - [58, Outrage]
      - [63, Close Combat]
    teachable: [Protect, Rest, Sleep Talk, Substitute, Facade, Endure, Attract, Double Team, Return,
      Frustration, Hidden Power, Secret Power, Swagger, Round, Toxic, Snore, Mud-Slap, Rock Tomb,
      Rock Slide, Smack Down, Stone Edge, Dig, Bulldoze, Earthquake, Sandstorm, Stealth Rock,
      Iron Defense, Iron Head, Dragon Tail, Scale Shot, Outrage, Crunch, Rollout, Take Down, Endeavor,
      Scary Face, Hyper Beam, Giga Impact, Rock Smash, Brick Break, Low Kick, Low Sweep, Close Combat,
      Superpower, Bulk Up, Body Press, Reversal, Revenge, Retaliate, Swords Dance, Dragon Claw,
      Breaking Swipe, Dual Chop, Smart Strike, Poison Jab, Brutal Swing, Helping Hand, Coaching]
    egg: []
  signature: >-
    It learns Wide Guard on evolving, the locked shields of the phalanx, and
    Dragon Dance at 54. Moxie lets it snowball through a team the way the sown
    men fought down to five.
