  myth: >-
    Cadmus killed Ares's dragon and, on Athena's advice, sowed its teeth. Armed
    men sprang from the furrows, the Spartoi or "sown men", and fought until
    only five remained (Ovid, Metamorphoses 3).
  design: >-
    A dragon's tooth half-buried like a seed, then a dragon-scaled hoplite
