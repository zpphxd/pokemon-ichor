    - {concept: Hooded wraith, types: [Ghost], evo: {method: held_item, item: Relic Copper}}
    - {concept: Ferryman, types: [Ghost, Water]}

- id: sphinx
  roles: [oddity]
  myth: >-
    The Sphinx sat on a rock outside Thebes and strangled anyone who failed her
    riddle. Her name comes from sphingo, "to squeeze". Oedipus answered it,
    and she threw herself from the rock.
  design: >-
    A winged lioness with a calm, knowing face, crouched on a rock, tail coiled
    like a question.
  habitat: The mountain road from Astyra to Delphoi.
  members:
    - {concept: Riddling sphinx, types: [Psychic, Fighting]}

# ── Kaldera: the volcanic forge (Laurel 6) ────────────────────────────────

- id: khalkotauros
  section: Kaldera
  roles: [regional]
  myth: >-
    The Khalkotauroi were bronze-hoofed, fire-breathing bulls that Hephaestus
    made for King Aeetes. Jason yoked them, protected by Medea's ointment
    (Apollonius, Argonautica 3).
  design: >-
    A calf with a glowing nose ring, then a bronze bull with a furnace in its
    chest and riveted plates.
  habitat: The forge slopes of Kaldera.
  members:
    - {concept: Furnace calf, types: [Fire], evo: {method: level, level: 33}}
    - {concept: Bronze bull, types: [Fire, Steel]}

- id: polybotes
  roles: [regional, Team Titan]
  myth: >-
    In the war of the Giants, Poseidon tore a piece off Kos and threw it on the
    giant Polybotes. It became the volcanic island of Nisyros, and its smoke is
    the giant's breath (Apollodorus 1.6.2).
  design: >-
    A smoldering cinder, then a giant buried to the shoulders with a small
    island, hut and all, on its back, breathing smoke.
  habitat: The floor of Kaldera's caldera.
  notes: Admin Hyperion's ace (Fire/Rock).
  members:
    - {concept: Smoldering cinder, types: [Fire], evo: {method: level, level: 35}}
    - {concept: Buried giant, types: [Fire, Rock]}

- id: telchine
  roles: [regional, story]
  myth: >-
    The Telchines were flippered sea-spirits of Rhodes and the first
    metalworkers. They forged Poseidon's trident and the adamant sickle that
    Kronos used on Ouranos (Strabo 14.2.7).
  design: >-
    A seal-like pup with a tiny hammer, then a flippered smith with an anvil
    shell and tongs.
  habitat: Kaldera's black-sand shores and sea caves.
  notes: They made the Harpe, so they tie straight into the Kaldera chapter.
  members:
    - {concept: Smith pup, types: [Water], evo: {method: level, level: 34}}
    - {concept: Telchine smith, types: [Water, Steel]}

- id: narthex
  roles: [regional]
  myth: >-
    Prometheus stole fire from the gods hidden in a hollow fennel stalk, the
    narthex, and gave it to mortals (Hesiod, Works and Days). He was a Titan who
    chose humanity.
  design: >-
    A fennel sprout, then a tall fennel stalk with an ember glowing inside its
    hollow stem. It evolves with a Fire Stone.
  habitat: Kaldera's volcanic slopes; Kalliste's dry hillsides (sprout, rare).
  notes: A Titan's gift, so it works as a foil to Team Titan.
  members:
    - {concept: Fennel sprout, types: [Grass], evo: {method: stone, item: Fire Stone}}
    - {concept: Fire-bearing fennel, types: [Grass, Fire]}

# ── Kythera Isle: sea-foam coves (Laurel 7) ───────────────────────────────

- id: foam
  section: Kythera Isle
  roles: [regional]
  myth: >-
    Aphrodite was born from the sea foam (aphros) and came ashore first at
    Kythera and then at Cyprus (Hesiod, Theogony 188–200). Art shows her
    riding a scallop shell.
  design: >-
    A closed scallop shell, then a foam spirit standing in the open shell. It
    evolves with a Shiny Stone.
  habitat: Kythera's sea-foam beaches.
  members:
    - {concept: Foam scallop, types: [Water], evo: {method: stone, item: Shiny Stone}}
    - {concept: Foam-born, types: [Water, Fairy]}

- id: narcissus
  roles: [regional, pair]
  myth: >-
    Narcissus scorned Echo, so Nemesis made him fall in love with his own
    reflection in a spring. He wasted away and became the narcissus flower
    (Ovid, Metamorphoses 3).
  design: >-
    A bulb, then a white narcissus forever bending over the water. Its ability
    is Oblivious, and its hidden ability is Mirror Armor. It evolves only at the
    Spring of Kallirhoe.
  habitat: The Spring of Kallirhoe, Kythera.
  members:
    - {concept: Spring bulb, types: [Grass], evo: {method: location, place: Spring of Kallirhoe}}
    - {concept: Narcissus, types: [Grass, Water]}

- id: echo
  roles: [oddity, pair]
  myth: >-
    Hera cursed the nymph Echo to repeat only the last words she heard. Echo
    pined for Narcissus until nothing was left of her but her voice (Ovid,
    Metamorphoses 3).
  design: >-
    A faint, half-visible nymph-sprite with no mouth, only a ripple. It learns
    only copying moves: Mimic, Copycat, Mirror Move and Echoed Voice.
  habitat: Kythera's sea caves, usually near Narcissus.
  members:
    - {concept: Echo, types: [Normal]}

- id: eros
  roles: [regional, baby]
  myth: >-
    Eros, Aphrodite's winged son, kindles love with gold arrows and kills it
    with lead ones. His arrows started Daphne's story.
  design: >-
    A chubby winged infant (an Erote) with a toy bow, then a slim winged archer
    with gold and lead arrows.
  habitat: Kythera (Eros); the Erote hatches from eggs.
  members:
    - {concept: Erote, types: [Fairy], baby: true, evo: {method: friendship_day}}
    - {concept: Eros, types: [Fairy, Flying]}

- id: galatea
  roles: [regional]
  myth: >-
    Pygmalion of Cyprus carved a statue so lovely he fell in love with it. He
    prayed at Aphrodite's festival, and the statue warmed into a living woman
    (Ovid, Metamorphoses 10). Later writers named her Galatea.
  design: >-
    A marble chip with a single carved eye, then a living statue with cracks of
    warm light where the stone has woken. It evolves through friendship: love
    brings it to life.
  habitat: The marble temple grounds of Kythera; Astyra's sculptors' quarter.
  notes: Hierophant Galatea's ace and namesake. Ovid's statue was ivory; Aethos uses marble to match her epithet.
  members:
    - {concept: Marble chip, types: [Rock], evo: {method: friendship}}
    - {concept: Living statue, types: [Rock, Fairy]}

# ── Knossa Isle: the Labyrinth and Daedalus's workshop ────────────────────

- id: minotaur
  section: Knossa Isle
  roles: [oddity, story]
  myth: >-
    Asterion, the Minotaur, was the son of Pasiphae and Poseidon's white bull.
    He was shut in Daedalus's Labyrinth and fed youths until Theseus killed him.
  design: >-
    A hulking bull-headed brawler, more sad than cruel, with a broken chain on
    one wrist.
  habitat: The center of the Labyrinth, Knossa.
  notes: The bible's "a Minotaur waits at the center".
  members:
    - {concept: Minotaur, types: [Fighting, Dark]}

- id: ariadne
  roles: [oddity]
  myth: >-
    Ariadne gave Theseus a ball of thread to find his way out of the Labyrinth.
    Later Dionysus married her, and her wedding crown became the Corona
    Borealis.
  design: >-
    A living ball of red thread with a starry crown. It always knows the way
    out, and learns Teleport and Follow Me.
  habitat: The Labyrinth's passages.
  members:
    - {concept: Thread-ball, types: [Normal]}

- id: icarus
  roles: [oddity]
  myth: >-
    Daedalus made wings of feathers and wax. Icarus flew too near the sun, the
    wax melted, and he fell into the sea (Ovid, Metamorphoses 8). A story of
    hubris.
  design: >-
    A moth drawn to the sun on wax-and-feather wings that droop in the heat.
    Its ability is Solar Power: stronger in sunlight, but it burns.
  habitat: The cliffs below Daedalus's workshop, on sunny days.
  members:
    - {concept: Wax-winged moth, types: [Bug, Flying]}

- id: talos
  roles: [regional]
  myth: >-
    Talos was the bronze giant Hephaestus made to guard Crete. He circled the
    island three times a day throwing boulders. A single vein of ichor ran from
    his neck to his ankle, sealed with a bronze nail, until Medea pulled it out
    (Apollonius, Argonautica 4).
  design: >-
    A small bronze figurine, then a towering bronze sentinel with a glowing gold
    ichor vein and a nail at the ankle. Trade it holding a Metal Coat to evolve.
  habitat: Kaldera's forge (figurine); Knossa's coastal cliffs (sentinel).
  notes: Hierophant Talos's ace and namesake. Its ichor vein echoes the game's title.
  members:
    - {concept: Bronze figurine, types: [Steel], evo: {method: trade_item, item: Metal Coat}}
    - {concept: Bronze sentinel, types: [Steel, Ground]}

- id: kouretes
  roles: [regional, story]
  myth: >-
    The Kouretes danced in armor, clashing spears on shields, so that Kronos
    would not hear infant Zeus crying in the Cretan cave (Strabo 10.3).
  design: >-
    A round bronze shield with eyes, then a crested shield-dancer beating spear
    on shield. Its ability is Punk Rock.
  habitat: The Diktaean cave, Knossa; the Lakonian battle school.
  notes: Ancient guardians against Kronos, a nice echo for the finale.
  members:
    - {concept: Clashing shield, types: [Steel], evo: {method: level, level: 35}}
    - {concept: Shield-dancer, types: [Steel, Fighting]}

- id: cyclops
  roles: [fossil]
  myth: >-
    The Cyclopes, among them Polyphemus the shepherd (Odyssey 9). Dwarf-elephant
    skulls found on Mediterranean islands have one big central hole where the
    trunk attached, and they are a likely source of the one-eyed giants.
  design: >-
    A revived dwarf elephant whose trunk socket looks like one great eye, with
    small real eyes on the sides. It grows into a shaggy, giant-sized shepherd
    beast.
  habitat: A skull fossil dug at Knossa, revived in Daedalus's workshop. You choose one of the two fossils; the other turns up in Atlantis.
  notes: A myth misread from a fossil, which is Daphne's thesis made literal.
  members:
    - {concept: Skull fossil revived, types: [Rock, Normal], evo: {method: level, level: 39}}
    - {concept: Cyclops, types: [Rock, Normal]}

- id: belemnite
  roles: [fossil]
  myth: >-
    Belemnite fossils are named from the Greek belemnon, "dart". For centuries
    people took these bullet-shaped stones for thunderbolts that had fallen from
    the sky.
  design: >-
    A revived squid with a bullet-shaped stone guard that stores lightning. It
    grows into a thunder-squid that fires charged darts.
  habitat: A dart fossil dug at Knossa, revived in Daedalus's workshop (the fossil choice).
  members:
    - {concept: Dart fossil revived, types: [Rock, Electric], evo: {method: level, level: 39}}
    - {concept: Thunderbolt squid, types: [Rock, Electric]}

