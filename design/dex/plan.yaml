# ── Legendaries and mythicals ─────────────────────────────────────────────

- id: moirai
  section: Legendaries and mythicals
  group: true   # three separate species, not an evolution line
  roles: [legendary trio, story]
  myth: >-
    The three Fates. Klotho spins the thread of each life, Lachesis measures it
    and allots each person's share, and Atropos, "the unturnable", cuts it
    (Hesiod, Theogony; Plato, Republic 10).
