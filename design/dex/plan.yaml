    - {concept: Healer serpent, types: [Poison, Fairy]}

- id: charon
  roles: [regional]
  myth: >-
    The unburied dead wander the near bank for a hundred years. Charon ferries
    across the Styx only those who carry an obol, the coin placed in a dead
    person's mouth.
  design: >-
    A small shade with an empty open palm, then a hooded wraith, then Charon,
    a gaunt ferryman fused to his reed boat, with a pole and a lantern. The last
    stage needs an old coin.
  habitat: Astyra's Kerameikos cemetery (shade); Cape Tainaron (wraith); the Styx (ferryman).
  members:
