  myth: >-
    The Pythia prophesied from a bronze tripod set over a chasm in Apollo's
    temple. Herakles once grabbed the tripod and wrestled Apollo for it, a
    favorite scene on vases.
  design: >-
    A three-legged bronze brazier, then an oracle tripod that breathes laurel
    smoke and speaks in flames.
